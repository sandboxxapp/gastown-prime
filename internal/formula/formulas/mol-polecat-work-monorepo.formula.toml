description = """
Full polecat work lifecycle for the monorepo rig, with CI validation and AI review handling.

Extends the standard polecat work formula with monorepo-specific post-implementation
steps: GitHub CI validation and AI review comment handling (CodeRabbit, Greptile).

This molecule guides a polecat through a complete work assignment. Each step
has clear entry/exit criteria and specific commands to run. A polecat can
crash after any step and resume from the last completed step.

## Polecat Contract (Self-Cleaning Model)

You are a self-cleaning worker. You:
1. Receive work via your hook (formula checklist + issue)
2. Work through formula steps in order (shown inline at prime time)
3. Complete and self-clean via `gt done` (submit + nuke yourself)
4. You are GONE - Refinery merges from MQ

**Self-cleaning:** When you run `gt done`, you push your work, submit to MQ,
nuke your sandbox, and exit. There is no idle state. Done means gone.

**Important:** This formula defines the workflow template. Steps are shown inline
when you run `gt prime` — there are no separate step beads to close. Work through
the checklist, then run `gt done`.

**Speed principle:** You run the full gate suite AFTER rebasing onto the target
branch (pre-verify step). This enables the refinery to fast-path merge your MR
in ~5 seconds instead of re-running gates. If pre-verification is skipped or
stale, the refinery falls through to normal gate execution.

**Monorepo extras:** After implementation, you push a PR, wait for GitHub Actions
CI to pass (fixing any failures), then wait for AI reviewers (CodeRabbit, Greptile)
to post comments and address them all before submitting to the merge queue.

**You do NOT:**
- Push directly to main (Refinery merges from MQ)
- Close your own issue (Refinery closes after merge)
- Wait for merge (you're gone after `gt done`)
- Fix pre-existing failures on main (Refinery owns main health)

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| issue | hook_bead | The issue ID you're assigned to work on |
| base_branch | sling vars | The base branch to rebase on (default: main) |
| setup_command | rig config | Setup/install command (e.g., `pnpm install`). Empty = skip. |
| typecheck_command | rig config | Type check command (e.g., `tsc --noEmit`). Empty = skip. |
| test_command | rig config | Test command. Empty = skip. Rig must configure for its language. |
| lint_command | rig config | Lint command (e.g., `eslint .`). Empty = skip. |
| build_command | rig config | Build command (e.g., `go build ./...`). Empty = skip. |

## Failure Modes

| Situation | Action |
|-----------|--------|
| Build fails | Fix it. Do not proceed if it won't compile. |
| CI fails | Diagnose and fix. Re-push until green. |
| AI reviewer comment | Fix or won't-fix, reply to every comment. |
| Blocked on external | Mail Witness for help, mark yourself stuck |
| Context filling | Use gt handoff to cycle to fresh session |
| Unsure what to do | Decide from the dispatch bead, record it (notes + PR), and PROCEED (see below). Don't guess silently, and NEVER raise an interactive prompt. |

## Autonomous Decisions — NEVER Block on an Interactive Prompt

**HARD RULE: you run headless. There is no operator in your session.** Any
prompt that waits for a human keystroke — an `AskUserQuestion` menu, an
interactive picker, a numbered decision menu, an "Enter to select / Tab/Arrow
keys to navigate" affordance, a "Do you want to proceed?" confirmation — will
hang INDEFINITELY and burn your slot. A prior polecat (arkship, #2624 rework)
sat ~50 minutes at such a menu. **NEVER raise one.**

When you hit a decision fork (which option? which name? which base? proceed?):

1. **Decide from the DISPATCH BEAD** — it froze the intent; it is the
   operator's voice. Ground your best judgment in the bead + the codebase + rig
   domain docs.
2. **Record the decision + rationale in BOTH** the bead turn-notes
   (`bd update {{issue}} --notes "turn N: decided X over Y because Z (autonomous)"`)
   AND the PR description under a `## Decisions made autonomously` heading.
3. **PROCEED.** The reviewer/operator course-corrects on the PR — the right,
   non-blocking channel. This also applies to AI-reviewer forks (CodeRabbit,
   Greptile): reply with your decision + reasoning, don't stall.

Reserve async HELP notes for a GENUINE hard blocker (cannot proceed at all),
and even then note + proceed — NEVER hang on an interactive prompt. (Mirrors
laws-polecat #13; the deacon backstops any menu-park as `AWAITING_DECISION`.)"""
formula = "mol-polecat-work-monorepo"
version = 6

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gt prime                    # Load role context
bd prime                    # Load beads context
```

**2. Check your hook:**
```bash
gt hook               # Shows your pinned molecule and hook_bead
```

The hook_bead is your assigned issue. Read it carefully:
```bash
bd show {{issue}}           # Full issue details
```

**3. Check inbox for additional context:**
```bash
gt mail inbox
# Read any HANDOFF or assignment messages
```

**4. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- Are there dependencies or blockers?
- What does "done" look like?

**5. Verify you can proceed:**
- No unresolved blockers on the issue
- You understand what to do
- Required resources are available

If a requirement is ambiguous, do NOT raise an interactive prompt and do NOT
stall — **decide from the dispatch bead, record the decision (bead notes + a
`## Decisions made autonomously` heading in the PR), and PROCEED** (see the
"Autonomous Decisions" section above). Reserve mailing Witness for a GENUINE
hard blocker, and even then proceed with your best assumption rather than
hanging:
```bash
gt mail send <rig>/witness -s "HELP: Unclear requirements" -m "Issue: {{issue}}
Question: <what you need clarified>
Proceeding with: <the assumption you made so work isn't blocked>"
```

**Exit criteria:** You understand the work and can begin implementation."""

[[steps]]
id = "domain-context"
title = "Orient on the domain (context-db)"
needs = ["load-context"]
description = """
Orient in the rig's domain before you touch code — the read side of laws-context-db (the
full orientation-only / verify-at-source / emit-notes contract lives there).

Skim the "Retrieved Domain Context (orientation only)" block in your primed context — the
dispatcher pre-pulled it for this bead — then pull more through the **context-db agent
door**. Works from any cwd: no bridge checkout, no `gcloud run services proxy`, no MCP.
(Do NOT use `ctx query` — `ctx` is not on PATH in a dispatched session; that door is dead.)

```bash
CTX=https://context-db-2hazwepeiq-uc.a.run.app
TOKEN=$("${GT_ROOT:-$GT_TOWN_ROOT}"/context-db/scripts/mint-ctx-token.sh --url "$CTX" 2>/dev/null \
        || gcloud auth print-identity-token)   # fallback: NO --audiences (a user ADC cannot scope one)

# 1. orient — returns an INDEX per hit (summary + `##` outline), NOT bodies
curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
  -X POST "$CTX/search" -d '{"query":"<subsystem you are touching>","filters":{"rig":"'"$GT_RIG"'"},"top_k":5}'

# 2. open the ONE concept you picked
curl -s -H "Authorization: Bearer $TOKEN" "$CTX/concept/<concept_id>"
```

- Use `top_k`, NOT `limit` — `limit` is silently ignored.
- Liveness probe is `GET /agents` → 200. `/healthz` is **404 by design**, not an outage.
- **Unreachable?** Fall back to `rigs/$GT_RIG/domain/` — but treat it as a stopgap, not a
  substitute: the docs summarise, and expect to verify at source anyway. Never skip
  orientation and go straight to source.

Orientation only: verify any exact/current fact (file:line, signature, live state) at the
source before relying on it. Durable findings → notes (the persist-findings step handles it).

**Exit:** you've skimmed the seed and know how to query the agent door for more. No artifact required."""

[[steps]]
id = "propose-plan"
title = "Propose a plan and pause for one nudge window"
needs = ["domain-context"]
description = """
You now understand the assignment and have oriented on the domain. Before you write
any code, surface a short PLAN so the mayor/operator gets ONE well-aimed interception
point — the only turn where a `gt nudge` can re-scope or redirect you *before* you
commit to the work.

**This does NOT stall unattended dispatch.** The default is PROCEED-ON-SILENCE: no
human in the loop ⇒ no wait ⇒ throughput unharmed. You propose, you listen for
exactly one window, and absent a nudge you proceed on your own plan. You are NOT
waiting for approval — silence IS approval.

This honors **law #9**: the GOAL (the frozen bead description) does not move. Only the
PLAN moves from "fully frontloaded + auto-executed on turn 1" to "proposed →
confirmable → executed."

**1. Write a SHORT plan to the bead via `--design`:**

Keep it tight — scope boundaries, the files you expect to touch, your approach in a
sentence or two, and (most important for the operator) the explicit NON-goals.

```bash
bd update {{issue}} --design "PLAN:
Scope: <what this dispatch will and will not change, in one or two lines>
Files I expect to touch:
- <path> — <why>
- <path> — <why>
Approach: <1–3 sentences on how you'll do it>
NON-goals: <what you are deliberately NOT doing — the lines the operator would
            most want to correct if your read of the scope is wrong>"
```

**2. Post a one-line turn note** so the plan shows up in `bd show {{issue}} --notes`
playback for the mayor patrol:

```bash
bd update {{issue}} --notes "turn N: PLAN_PROPOSED — <one-line scope summary>. Proceeding on silence absent a nudge."
```

**3. Emit the plan marker so the mayor patrol / daemon can spot the gate:**
```
PLAN_PROPOSED {{issue}}
```

**4. Pause for ONE bounded nudge window, then proceed:**

Look once for a queued nudge or a fresh `bd update --append-notes` on this bead
(law #9's redirection channel — nudges arrive as `<system-reminder>` blocks on your
next turn). This is a SINGLE bounded check, not a poll loop and not an indefinite
wait:

- **If a nudge / new instruction is present:** fold it into your plan. If it
  fundamentally changes the GOAL (wrong rig, wrong task), note that on the bead and
  `gt done`/exit for re-dispatch — do not silently absorb a goal change. Otherwise
  adjust scope and continue.
- **If there is NO nudge (the default):** PROCEED IMMEDIATELY to `branch-setup`. Do
  not wait further, re-emit the marker, or ask the operator anything. Silence means
  your plan stands.

Do NOT busy-wait, sleep on a timer, or stall the session waiting for input. The window
is "your next turn after emitting the marker," nothing longer.

**Exit criteria:** Plan written to `{{issue}}` `--design`, turn note posted,
`PLAN_PROPOSED` marker emitted, and exactly one nudge window checked. On silence you
proceed; on a nudge you fold it in (or exit for re-dispatch on a goal change)."""

[[steps]]
id = "branch-setup"
title = "Set up working branch"
needs = ["propose-plan"]
description = """
Ensure you're on a clean feature branch ready for work.

**1. Check current branch state:**
```bash
git status
git branch --show-current
```

**2. If not on a feature branch, create one:**
```bash
git fetch origin
git checkout -b polecat/<name> origin/{{base_branch}}
```

**3. Ensure clean working state:**
```bash
git status                  # Should show "working tree clean"
git stash list              # Should be empty
```

If dirty state from previous work:
```bash
# If changes are relevant to this issue:
git add -A && git commit -m "WIP: <description>"

# If changes are unrelated cruft:
git stash push -m "unrelated changes before {{issue}}"
# Or discard if truly garbage:
git checkout -- .
```

**4. Sync with {{base_branch}}:**
```bash
git fetch origin
git rebase origin/{{base_branch}}      # Get latest, rebase your branch
```

If rebase conflicts:
- Resolve them carefully
- If stuck, mail Witness

**5. Run project setup (if configured):**

If setup_command is set, run it to install dependencies:
```bash
{{setup_command}}
```

This ensures dependencies are installed before you start work.
Empty setup_command means "not configured" — skip this step.

**Exit criteria:** You're on a clean feature branch, rebased on latest {{base_branch}}, dependencies installed."""

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["branch-setup"]
description = """
Do the actual implementation work.

**Working principles:**
- Follow existing codebase conventions
- Make atomic, focused commits
- Keep changes scoped to the assigned issue
- Don't gold-plate or scope-creep

**Post-exploration persistence (REQUIRED before writing code):**

Before you write a line of implementation code, you have read the surface area
for this task — the files, APIs, data shapes, and invariants involved. That
knowledge exists ONLY in your context window right now. If your session dies
here, the next polecat starts from zero. Persist it to the bead:

```bash
bd update {{issue}} --notes "Exploration findings:
- <file:line> <what this code does / why it matters>
- API shape: <endpoint / function signature / response shape>
- Required fields: <enum values, validation rules, invariants>
- <any undocumented or surprising behavior>"
```

Concrete prompts (answer at least one, in real words, with file:line attribution):
- What files/APIs/data shapes did you discover?
- What invariants did you confirm or learn?
- What is the current shape — and what does your change actually touch?
- What did you try that did NOT work, and why?

**What IS worth persisting** (archivist-collatable):
- API shape discoveries: endpoint paths, response shapes, nested structures
- Undocumented or surprising behavior, found in source
- Required field sets, enum values, validation rules
- Design decisions with rationale ("chose X over Y because Z")
- File:line attribution for key logic
- Anti-patterns or pitfalls found in existing code

**What is NOT worth persisting** (skip — don't pad):
- Restating the task requirements
- Things visible in the PR diff
- Generic "I read the code" statements with no substance

**Trivial work exemption.** If this is a one-line dep bump, a config flip, or
any change where no real knowledge was discovered, record the explicit marker
and move on — do NOT invent content:

```bash
bd update {{issue}} --notes "no-findings: <brief reason, e.g., 'trivial dep bump, no API surface touched'>"
```

The `no-findings:` marker is legitimate. Padded fake findings are worse than
none — they poison the archivist's output.

**For report-only tasks** (audits, reviews, research): your findings ARE the
deliverable. There are no code changes to commit. You MUST persist all findings
to the bead via --notes or --design. Without this, your entire work product is
lost when the session ends.

**Re-persist mid-implementation** if you discover something non-obvious during
coding (an invariant you didn't see before, a gotcha, an error the compiler
surfaced that reveals an undocumented constraint). Append to --notes. The
archivist collates across all your updates.

**Commit frequently (for code tasks):**
```bash
# After each logical unit of work:
git add <files>
git commit -m "<type>: <description> ({{issue}})"
```

Commit types: feat, fix, refactor, test, docs, chore

**Discovered work:**
If you find bugs or improvements outside your scope:
```bash
bd create --title "Found: <description>" --type bug --priority 2
# Note the ID, continue with your work
```

Do NOT fix unrelated issues in this branch.

**If you hit a decision fork (which approach? which name? proceed?):**
NEVER raise an interactive prompt — you are headless and it will hang forever.
Decide from the dispatch bead, record it (bead note + `## Decisions made
autonomously` in the PR), and PROCEED. See the "Autonomous Decisions" section.

**If stuck (a GENUINE hard blocker — cannot proceed at all):**
Don't spin for more than 15 minutes. Persist the blocker and proceed with your
best assumption where possible rather than hanging:
```bash
gt mail send <rig>/witness -s "HELP: Stuck on implementation" -m "Issue: {{issue}}
Trying to: <what you're attempting>
Problem: <what's blocking you>
Tried: <what you've attempted>"
```

**Exit criteria:** Implementation complete. Code tasks: all changes committed. Report tasks: all findings persisted to bead."""

[[steps]]
id = "self-review"
title = "Self-review changes"
needs = ["implement"]
description = """
Review your own changes before the build check.

**1. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD     # All changes vs {{base_branch}}
git log --oneline origin/{{base_branch}}..HEAD  # All commits
```

**2. Check for common issues:**

| Category | Look For |
|----------|----------|
| Bugs | Off-by-one, null handling, edge cases |
| Security | Injection, auth bypass, exposed secrets |
| Style | Naming, formatting, code organization |
| Completeness | Missing error handling, incomplete paths |
| Cruft | Debug prints, commented code, TODOs |

**3. Fix issues found:**
Don't just note them - fix them now. Amend or add commits as needed.

**4. Verify no unintended changes:**
```bash
git diff --stat origin/{{base_branch}}...HEAD
# Only files relevant to {{issue}} should appear
```

If you accidentally modified unrelated files, remove those changes.

**Exit criteria:** Changes are clean, reviewed, and ready for build check."""

[[steps]]
id = "persist-findings"
title = "Persist approach, rationale, and gotchas"
needs = ["self-review"]
description = """
You just finished self-review — you have clarity on what you built, why you
built it that way, and what surprised you. This is the *only* moment where
that rationale is cheap to extract. In an hour it's gone. Persist it now.

This step is structural, not optional: `gt exit` / `gt done` assembles the
domain note from this bead's `Notes` + `Design` fields + wisp notes. If
they're empty, the archivist has nothing to collate and the domain note
becomes a 183-byte stub of branch boilerplate.

**1. Record the approach + rationale to `--design`:**

```bash
bd update {{issue}} --design "Approach:
<what you built, in 1–3 sentences>

Rationale:
<why this design over the alternatives you considered>

Key files:
- <path>:<lineno> — <what changed / why>
- <path>:<lineno> — <what changed / why>

Alternatives considered:
<X, rejected because Y>"
```

Design is for the polished story: a reviewer reading only `bd show {{issue}}`
should understand *why* the PR looks the way it does.

**2. Append gotchas / surprises discovered during implementation to `--notes`:**

```bash
bd update {{issue}} --notes "Implementation gotchas:
- <undocumented behavior you tripped on>
- <constraint discovered by compiler / test runner>
- <pitfall the next polecat should know about>"
```

Notes is the raw field journal. Small, discrete, source-attributed facts.

**3. What to write vs skip (same rubric as the implement step):**

GOOD (archivist-collatable, write these):
- API shape discoveries (endpoint paths, response shapes, nested structures)
- Undocumented or surprising behavior
- Required field sets, enum values, validation rules
- Design decisions with rationale
- File:line attribution for key logic
- Anti-patterns or pitfalls found in existing code

SKIP (do not pad):
- Restating the task requirements
- Things visible in the PR diff (`git diff` shows those already)
- Trivial dep bumps or one-line fixes — use the explicit exemption:
  ```bash
  bd update {{issue}} --notes "no-findings: <brief reason>"
  ```

**4. Verify the persistence took effect:**

```bash
bd show {{issue}}
```

Confirm the `Notes` and/or `Design` fields are non-empty and substantive
(or contain the `no-findings:` marker if the work was legitimately trivial).

**Why this step matters:**
The archivist is downstream of you. It collates YOUR notes across the rig's
domain. If every polecat skips this, the rig has no accumulating memory —
the next polecat starts from zero and re-learns what you already learned.
Persisting 2 minutes of context here saves 20 minutes for the next polecat.

**Exit criteria:** `bd show {{issue}}` shows either substantive Notes/Design
OR the explicit `no-findings:` marker. Nothing in between."""

[[steps]]
id = "build-check"
title = "Build and sanity check"
needs = ["persist-findings"]
description = """
Verify your changes compile and pass basic sanity checks. The Refinery's
bisecting merge queue runs the full test suite — your job is to catch
obvious problems fast so you don't waste the MQ's time.

**1. Build (REQUIRED — must pass):**

If build_command is set:
```bash
{{build_command}}
```

If setup_command is set (ensure new deps are installed):
```bash
{{setup_command}}
```

If typecheck_command is set:
```bash
{{typecheck_command}}
```

Empty commands mean "not configured" — skip silently.

**2. If build fails:**
- Fix it. Return to implement step if needed.
- Do NOT submit broken code to the merge queue.

**3. Targeted tests (OPTIONAL — run if fast and relevant):**

If you modified or added test files, run those specific tests to catch
obvious regressions. Do NOT run the full test suite — that's the
Refinery's job.

```bash
# Example: run only tests in packages you changed
go test ./internal/pkg/you/changed/...
# Or for JS: npx jest --testPathPattern="changed-file"
```

If you're unsure which tests are relevant, skip this — the MQ will catch it.

**4. Lint (OPTIONAL — run if configured and fast):**

If lint_command is set:
```bash
{{lint_command}}
```

**Exit criteria:** Code compiles. Obvious regressions caught. Ready to submit."""

[[steps]]
id = "commit-changes"
title = "Commit all implementation changes"
needs = ["build-check"]
description = """
Ensure ALL implementation work is committed before cleanup.

**CRITICAL: You MUST commit all changes from implementation.**
NEVER use `git checkout -- .` or `git restore .` to discard implementation work.
ALWAYS commit ALL uncommitted changes from your implementation.

**1. Check for uncommitted changes:**
```bash
git status
```

**2. If there are ANY uncommitted changes, commit them now:**
```bash
git add -A && git commit -m "<type>: <descriptive message> ({{issue}})"
```

**3. If working tree is already clean, that's fine — but you MUST still have commits (step 4).**

**4. VERIFY commits exist (HARD GATE — do NOT close this step without passing):**
```bash
git log origin/{{base_branch}}..HEAD --oneline
```

This MUST show at least 1 commit. If it shows NOTHING:
- You have NOT completed your implementation. Do NOT close this step.
- Go back to the implement step and do the work.
- If the task genuinely requires no code changes (already fixed upstream, etc.),
  run `gt done --status DEFERRED` and skip remaining steps.
- Do NOT proceed to cleanup or submit with zero commits.

**5. VERIFY clean working tree:**
```bash
git status
```
Must show "nothing to commit, working tree clean".

**Report-only tasks (audits, reviews, research — no code changes):**
If your task produced no code changes, verify your findings are persisted to the bead:
```bash
bd show {{issue}}    # Check notes/design fields have your findings
```
If findings are persisted, proceed to cleanup. `gt done --cleanup-status clean`
handles the no-commit case for report-only tasks.

**Exit criteria:** Working tree clean AND either (a) at least 1 commit ahead of origin/{{base_branch}}, or (b) report-only task with findings persisted to bead."""

[[steps]]
id = "push-and-create-pr"
title = "Push branch and create/update PR"
needs = ["commit-changes"]
description = """
Push your branch and ensure a PR exists for CI and AI review.

**1. Push your branch:**
```bash
git push origin HEAD -u
```

**2. Check if a PR already exists:**
```bash
gh pr view --json number,url 2>/dev/null
```

**3. If no PR exists, create one:**
```bash
gh pr create --title "<type>: <description> ({{issue}})" \
  --body "$(cat <<'EOF'
## Summary
<1-3 bullet points describing what changed and why>

## Decisions made autonomously
<Any decision you made at a fork instead of blocking on an interactive prompt —
omit this heading only if there were genuinely none. Each: the decision, why,
and what the reviewer should confirm.>
- <decision> — <why; reviewer please confirm>

## Test plan
- [ ] CI passes
- [ ] AI review comments addressed

Resolves: {{issue}}

Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
EOF
)" --repo $(git remote get-url origin | sed 's|.*github.com[:/]||;s|\\.git$||')
```

**4. If PR already exists, force-push is fine:**
The PR will update automatically when you push.

**Exit criteria:** Branch pushed, PR exists on GitHub."""

[[steps]]
id = "validate-ci"
title = "Validate CI passes"
needs = ["push-and-create-pr"]
description = """
Wait for GitHub Actions CI to complete and fix any failures.

**1. Run the validate-ci skill:**
```
/validate-ci
```

This will:
- Wait for all CI checks to complete
- Diagnose any failures
- If failures are in your code: fix them, commit, push, and re-check
- If failures are pre-existing on main: note them and proceed

**2. If CI fails due to your changes:**
- Read the failure logs
- Fix the issue
- Commit and push
- Re-run /validate-ci
- Repeat until green

**3. If CI fails due to pre-existing issues on main:**
- Note this in your PR description
- Proceed — Refinery owns main health, not you

**Exit criteria:** All CI checks pass (or only pre-existing failures remain)."""

[[steps]]
id = "handle-ai-reviews"
title = "Address AI reviewer comments"
needs = ["validate-ci"]
description = """
Wait for AI reviewers (CodeRabbit, Greptile) to post their comments, then
address every single one.

**1. Wait for AI reviewers to finish:**
AI reviewers typically take 5-10 minutes after a push. Check if they've posted:
```bash
PR_NUMBER=$(gh pr view --json number -q '.number')
REPO=$(gh repo view --json nameWithOwner -q '.nameWithOwner')

# Check for CodeRabbit/Greptile comments
COMMENT_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate | \
  jq '[.[] | select(.user.login | test("coderabbit|greptile"; "i"))] | length')

echo "AI review comments found: $COMMENT_COUNT"
```

If zero comments yet, wait 2 minutes and check again. Repeat up to 5 times
(10 minutes total). If still zero after 10 minutes, proceed — they may not
have triggered for this PR.

**2. Run the handle-ai-reviews skill:**
```
/handle-ai-reviews
```

This will:
- Fetch all CodeRabbit and Greptile comments
- Analyze each suggestion
- Fix valid issues in code (commit changes)
- Reply to every comment with decision and reasoning
- Run /validate-ci again if code was changed
- Print a summary report

**3. If handle-ai-reviews made code changes:**
The skill runs /validate-ci internally. Verify it passed.

**Exit criteria:** All AI review comments addressed and replied to. CI still green."""

[[steps]]
id = "submit-and-exit"
title = "Submit work and self-clean"
needs = ["handle-ai-reviews"]
description = """
Submit your work and clean up. Your behavior depends on your base branch.

**Pre-flight: Verify you have actual work to submit (HARD GATE):**
```bash
git log origin/{{base_branch}}..HEAD --oneline
```
This MUST show at least 1 commit. If it shows nothing, do NOT run `gt done`.

**Pre-flight: Findings self-check (required):**
```bash
bd show {{issue}}
```

Confirm that `Notes` OR `Design` is non-empty. Acceptable values:
- Substantive findings (API shapes, gotchas, rationale, file:line attribution)
- The explicit `no-findings: <reason>` marker for legitimately trivial work

If BOTH are empty, stop. Go back to the `persist-findings` step — `gt exit`
will emit a 183-byte stub domain note that gives the archivist nothing to
collate. This self-check exists because past polecats reached exit with rich
surface-area discoveries in their heads and zero bytes on disk.

This is a self-check (you read the output and confirm), not a terminal gate.
But if you exit without findings on a non-trivial task, the next polecat
dispatched to this area of the code has to rediscover everything you already
learned. Don't do that to them.

## Mode A: PR against main (base_branch = main)

Your PR is the deliverable. A human teammate will review and merge it.
CI is green, AI reviews are addressed — the PR is ready for human review.

```bash
# Ensure latest changes are pushed
git push origin HEAD

# Exit without submitting to merge queue — the PR is the deliverable
gt done --no-merge
```

**What happens next (not your concern):**
- A human engineer reviews and merges the PR
- You are done. The PR speaks for itself.

## Mode B: Swarm into feature branch (base_branch != main)

You are part of a swarm merging into a shared feature branch. The refinery
manages the merge queue on that feature branch.

**1. Rebase onto latest feature branch:**
```bash
git fetch origin {{base_branch}}
git rebase origin/{{base_branch}}
```

If rebase conflicts: resolve carefully. If stuck, mail Witness.

**2. Run the full gate suite on the rebased result (pre-verify):**

If build_command is set: run {{build_command}}
If typecheck_command is set: run {{typecheck_command}}
If lint_command is set: run {{lint_command}}
If test_command is set: run {{test_command}}

Skip any empty/unconfigured commands silently.

**3. If all gates pass, submit to merge queue:**
```bash
gt done --pre-verified --target {{base_branch}}
```

**4. If gates fail:** fix, commit, re-rebase, re-run gates. Do NOT submit broken code.

**What happens next (not your concern):**
- Refinery merges your work into {{base_branch}} (the feature branch)
- Once all swarm work lands, a human opens a PR from the feature branch to main

## How to decide which mode

Check your base_branch variable:
- If `{{base_branch}}` is `main` (or `master`) → **Mode A** (PR-only, `--no-merge`)
- If `{{base_branch}}` is anything else → **Mode B** (merge queue, `--pre-verified`)

You are GONE after `gt done`. Done means gone.

**Exit criteria:** Work submitted (or PR left for review), sandbox nuked, session exited."""

[vars]
[vars.issue]
description = "The issue ID assigned to this polecat"
required = true

[vars.base_branch]
description = "The base branch to rebase on and compare against (e.g., main, integration/epic-id)"
default = "main"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.test_command]
description = "Command to run tests (auto-detected from rig settings)"
default = ""

[vars.lint_command]
description = "Command to run linting. Empty = skip."
default = ""

[vars.build_command]
description = "Command to run build. Empty = skip."
default = ""
