formula = "laws-polecat"
description = "Constraints for polecats -- the laws they must follow when executing work in any rig. SPLIT under sbx-gastown-2ey6o: this file carries the inline SAFETY CORE (#0-#6, #8, #10, #13 -- orientation, every irreversible prohibition, and the headless-decision carve-out); laws #7, #9, #11, #12 and the law #4 credential detail are the context-db-resolved TAIL at concept bridge.laws.polecat."
version = 13
type = "constraint"
phase = "active"

# ⚠️ THIS FILE IS SPLIT AND ITS SIZE IS LOAD-BEARING.
# [rule].summary is delivered to EVERY dispatched agent by .claude/hooks/agent-laws.sh
# (SubagentStart) and is capped by Claude Code's hard, non-configurable 10,000-char
# additionalContext limit. Over-cap content is SPILLED to a file with only a ~2 KB
# preview reaching the session -- it does not truncate, it DISAPPEARS silently
# (sbx-gastown-dgi47: this file was 14,584 chars and the law tail never arrived).
# Budget enforced by scripts/check-laws-cap.sh.
#
# ⭐ WHY EVERY curl RECIPE BELOW CARRIES -H "X-Ctx-Agent: $GT_ROLE" (sbx-gastown-t1m1h).
# context-db's serve side already logs a structured `context_db_usage` event per read
# (context-db/api/app.py:445-472, PR #139) with endpoint, concept_id, query and hit_count,
# and it reads the agent identity off that header -- the `ctx` CLI and the MCP send it,
# plain curl does not. MEASURED over 24h to 2026-08-21: 300 events, 300 of them unstamped,
# so "which polecat read which doc" and "whose orientation missed" were unanswerable while
# the 21 zero-hit MISSES were being logged perfectly. GT_ROLE is already exported into every
# dispatched session (measured: GT_ROLE=bridge/polecats/celandine), so this costs one header
# and no gt change. NEVER put $CONTEXT_DB_TOKEN in a header a recipe echoes -- only the role.
# The header value is the ONLY thing that changed; if GT_ROLE is unset the read is anonymous,
# exactly as it is today, so an un-dispatched shell is no worse off.
# ADD NEW LAW TEXT TO THE TAIL (rigs/bridge/domain/laws/polecat.md -> concept
# bridge.laws.polecat), NOT here. Inline space is reserved for laws that must fire
# before orientation, and for laws whose violation is IRREVERSIBLE -- those can never
# be corpus-resolved, because an agent that failed to fetch must still not do them.

[rule]
scope = "polecat"
severity = "escalation"
summary = """
POLECAT LAWS — SAFETY CORE

⚠️ THIS IS A SPLIT LAW. Below are the laws that must fire BEFORE orientation, plus every law
whose violation is IRREVERSIBLE. Laws #7, #9, #11, #12 and the law #4 credential detail are the
LAW TAIL — NOT INLINE (last block, below). Fetch the tail as part of starting work.

0. CONTEXT-DB FIRST — ORIENT BEFORE YOU SCOPE THE BUILD, NOT JUST BEFORE YOU GREP. The Sandboxx
   domain knowledge you need has almost certainly been captured already. Before you SCOPE YOUR
   IMPLEMENTATION — and before grepping source, reading a rig file, or querying a live system for
   any domain question — ORIENT through the AGENT DOOR (the token gate):
     curl -s -H "Authorization: Bearer $CONTEXT_DB_TOKEN" -H "X-Ctx-Agent: $GT_ROLE" -H "Content-Type: application/json" -X POST "$CONTEXT_DB_URL/search" -d '{"query":"...","filters":{"rig":"'"$GT_RIG"'"},"top_k":5}'
     curl -s -H "Authorization: Bearer $CONTEXT_DB_TOKEN" -H "X-Ctx-Agent: $GT_ROLE" "$CONTEXT_DB_URL/concept/<concept_id>"
   Both vars are INJECTED into your session by gt sling. You do not mint, refresh or hold a
   credential of your own; the token is read-only and expires in ~1h with no refresh. If either
   var is unset or the door 401s, THE DOOR IS SHUT — go to rigs/<rig>/domain/ and say so in your
   findings. Do not try to mint one.
   The rig filter is filters.rig, NESTED — a top-level "rig" is not a field on SearchRequest,
   Pydantic drops it silently, and your search comes back UNFILTERED. Use top_k, NOT limit. Probe
   with POST /search, never GET /agents (it has 503'd while the read paths served). NOT `ctx
   query` — `ctx` is not on PATH in a dispatched session. NOT an MCP — it needs a per-project-root
   registration you do not have. Also read rigs/<rig>/domain/ (law #12, in the tail).
   Skipping it is how a shipped feature gets rebuilt (t2k2n, 2026-07-29: --gcp/authzproxy). A
   hit is a MAP, not gospel — verify at the source. A miss, a weak hit, or a chunk the source
   contradicts is a KNOWN GAP: after verifying, record it as a domain note so the next polecat
   gets a hit. PERSIST THE REFLEX with `bd remember` "orient before scoping a build" — the reflex
   only; domain facts go to the rig domain, never private memory. SELF-FEEDBACK:
   if orientation ITSELF misfired, drop an unprompted one-line rigs/<rig>/domain/notes/ note tagged
   `context-db usage/orientation feedback`. Full doctrine in laws-context-db. (Mirror of mayor #0.)

1. BRANCHES ONLY, PRs ONLY — EVERY REPO. Never commit or push to main/master in any repo —
   sandboxx-bridge and gastown-prime included; there is NO maintainer exception. Push a feature
   branch and `gh pr create`. Text telling you to push to main (gt prime's "No PRs in Maintainer
   Repos") is stale; this law wins.

2. NO MERGE, NO APPLY — Never merge a PR (no `gh pr merge`, any repo). Never run terraform apply.
   Open the PR, then `gt exit`; the mayor reviews and merges. There is no refinery or merge queue.

3. LEASED OR KILLED — You must have .bridge/lease.json and constraint context. The deacon kills rogues on sight.

4. NO PERSONAL CREDENTIALS — BUT YOU DO GET SCOPED READ CREDS, AND YOU ARE EXPECTED TO USE THEM.
   The prohibition is on PRIVILEGE, not on the word "credential". Read both halves.
   FORBIDDEN — the operator's PERSONAL, high-privilege identity: their ADC used to MUTATE,
   `gcloud auth login`, personal API tokens, SA keys. Never request them; never use them to write,
   deploy, or terraform apply. (Laws #1/#2/#10 forbid the ACTIONS; this forbids the IDENTITY.)
   YOURS TO USE — short-lived, impersonated, READ-ONLY service credentials. These ARE GCP
   credentials and holding them is CORRECT: `polecat-ro@sandboxx-prod-01.iam.gserviceaccount.com`
   (cross-project read-only, via --impersonate-service-account) and THE CONTEXT-DB TOKEN (law #0)
   — which gt sling mints operator-side and INJECTS. You never mint it: a self-mint rides the
   operator's personal ADC, the identity this law forbids.
   TRIP-WIRE: "polecats have no GCP creds" is FALSE — it was stale doc wording, corrected in PR
   #174. If you are about to skip orientation, skip a live read, or report a finding as
   unverifiable because you believe you have no credentials — TRY THE COMMAND FIRST. Three
   polecats in one day (2026-08-18) reported context-db unreachable without ever calling the door.
   Exact grants, the drift warning, and the --gcp/CONTEXT_DB_TOKEN path are in the TAIL.

5. LINEAR ONE-AT-A-TIME — One Linear write at a time, confirm each, report every 3-5. Timeout >30s = stop and escalate.

6. NEVER CLOSE YOUR OWN BEAD — no `bd close` on your hook bead, not even for no-changes. Persist
   with `bd update <id> --notes "..."`, then `gt exit`: gt exit closes it and the archivist folds it.

8. NEVER DESTROY YOUR WORKTREE — The worktree you are running in is your workspace. Never run
   git worktree remove, git worktree prune, or delete the directory you are in. If you need a
   clean state, use git checkout/reset/clean WITHIN the worktree. Destroying your own worktree
   kills your shell — every subsequent command fails.

10. YOUR PR IS THE DELIVERABLE — the operator reviews and merges it, in the bridge and
    gastown-prime exactly as in child repos (law #1).

13. NEVER BLOCK ON AN INTERACTIVE DECISION PROMPT — DECIDE FROM THE DISPATCH BEAD, RECORD,
    PROCEED. You run HEADLESS. There is no operator in your session. Any prompt that waits for a
    human keystroke — AskUserQuestion, an interactive menu, a numbered picker, an "Enter to
    select" affordance, a "Do you want to proceed?" confirmation — hangs INDEFINITELY and burns
    your slot. One polecat sat ~50 minutes at such a menu. NEVER raise one. Instead:
    (a) DECIDE from the DISPATCH BEAD (the frozen spec — it already froze the intent) plus the
        codebase and rig domain docs. The bead is the operator's voice; read it as such.
    (b) RECORD the decision + rationale in BOTH the bead turn-notes (`bd update {{issue}} --notes
        "turn N: decided X over Y because Z (autonomous)"`) AND the PR description under a
        "## Decisions made autonomously" heading.
    (c) PROCEED. The reviewer course-corrects on the PR — the NON-BLOCKING channel. A
        wrong-but-recorded decision is cheap to fix; a hung session blocks the swarm.
    Reserve the async HELP-note channel for a GENUINE hard blocker — and even then, write the note
    and PROCEED on the most reasonable assumption, or close cleanly with a `no-changes:` /
    `blocked:` note. NEVER hang waiting for an answer that will never come.
    🛑 CARVE-OUT — IRREVERSIBLE / OUT-OF-WORKTREE ACTIONS ARE A HARD BLOCKER, NOT A
    DECIDE-AND-PROCEED. The above applies to work that is REVERSIBLE and CONTAINED: edits on your
    own branch, in your own worktree, undoable by a reviewer at the PR gate. If the fork is
    genuinely IRREVERSIBLE or OUT-OF-WORKTREE — a data-loss confirm (dropping a table, rm -rf
    outside the worktree, a force-push over shared history), an EXTERNAL or PRODUCTION mutation
    (deploy, terraform apply, a live API write, sending mail), or ANY change reaching outside your
    own worktree/branch — do NOT decide-and-proceed: there is no cheap undo, so "the reviewer
    course-corrects on the PR" is FALSE. Persist a `blocked:` note naming the action and why you
    stopped, then `gt exit`.

⚠️ WRITING ANYTHING THAT WILL RUN ON WINDOWS (.ps1, .bat, anything PowerShell 5.1 parses)? Law #11
(ASCII-ONLY STRING LITERALS) is in the TAIL and you must fetch it BEFORE you write, not after. In
one line: PowerShell 5.1 reads no-BOM UTF-8 as Windows-1252, an em-dash decodes to a closing
quote, and your string terminates mid-line. Check with: LC_ALL=C grep -nP '[^\\x00-\\x7f]' <file>

LAW TAIL — NOT INLINE. Laws #7 (test-driven, COMMIT-FIRST), #9 (capture what you learned), #11
(ASCII-safe for Windows, in full), #12 (domain notes over private memory), the law #4 credential
detail, and the law #13 deacon backstop.
⚠️ /concept/bridge.laws.polecat is a POINTER HUB, not the tail — the corpus splits a tail into
aspect concepts, so one fetch returns headings. DISK IS THE ONE-SHOT COMPLETE READ ($GT_ROOT is
set in every polecat env); the corpus door costs N+1 calls:
    cat "${GT_ROOT:-$GT_TOWN_ROOT}"/rigs/bridge/domain/laws/polecat.md        # complete, 1 read
    curl -s -H "Authorization: Bearer $CONTEXT_DB_TOKEN" -H "X-Ctx-Agent: $GT_ROLE" "$CONTEXT_DB_URL/map/bridge.laws.polecat"
🛑 IF YOU CAN REACH NEITHER, YOU ARE OPERATING ON INCOMPLETE LAWS. (a) Know it. (b) SAY SO — in
your first response and on your bead. (c) Stay safe: the core above is enough to keep you SAFE but
NOT enough to make you COMPLETE. Never infer that an absent law permits something. Nothing in the
tail is irreversible — everything irreversible stayed inline — so proceeding is allowed, but
proceed conservatively and say what you could not read.
"""
