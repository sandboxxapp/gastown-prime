description = """
Full polecat work lifecycle from assignment through completion.

This molecule guides a polecat through a complete work assignment. Each step
has clear entry/exit criteria and specific commands to run. A polecat can
crash after any step and resume from the last completed step.

## Polecat Contract (Dispatch-and-Kill Model)

You are a dispatch-and-kill worker. You:
1. Receive work via your hook (formula checklist + issue)
2. Work through formula steps in order (shown inline at prime time)
3. Submit a PR via `gh pr create` and exit
4. The mayor reviews and merges your PR

**Important:** This formula defines the workflow template. Steps are shown inline
when you run `gt prime` — there are no separate step beads to close. Work through
the checklist, then submit your PR and exit.

**You do NOT:**
- Push directly to main (PRs are the only path to main)
- Merge your own PR (the mayor reviews and merges)
- Fix pre-existing failures on main (Refinery owns main health)
- Run `gt done` — **the exit verb is `gt exit`** (sbx-gastown-vf98i). `gt done` submits to a
  merge queue and transitions you to IDLE with the sandbox and session PRESERVED; this town
  runs dispatch-and-kill, where the slot must be RELEASED. They are not synonyms. Every
  bridge role formula uses `gt exit`; see `mol-polecat-review-pr` for the full history.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| issue | hook_bead | The issue ID you're assigned to work on |
| base_branch | sling vars | The base branch to rebase on (default: main) |
| setup_command | rig config | Setup/install command (e.g., `pnpm install`). Empty = skip. |
| typecheck_command | rig config | Type check command (e.g., `tsc --noEmit`). Empty = skip. |
| test_command | rig config | Test command. Empty = skip. Rig must configure for its language. |
| lint_command | rig config | Lint command (e.g., `eslint .`). Empty = skip. |
| build_command | rig config | Build command (e.g., `go build ./...`). Empty = skip. |

## Scoped Credentials (`--secrets <profile>`)

When the mayor dispatches you with `gt sling … --secrets <profile>`, scoped
app/service credentials for that profile are injected into your environment as
plain env vars (the profile's named `vars`, sourced from a gitignored dotenv —
see `.mcp-secrets.json` `secret_profiles`). Use them to reach the real
app/service backend the task needs (e.g. run a dry-run/apply against a prod admin
API). They are absent unless you were dispatched with `--secrets`.

- **Read them from the environment** (`os.environ[...]` / `$VAR`). They are
  least-privilege: only the profile's named vars are present — nothing else from
  the dotenv leaks.
- **NEVER print, echo, log, or commit the values.** Reference them by name only;
  do not write them to disk, a test fixture, a PR body, or a turn note. (`gt`
  already masks them — it logs only the profile name + var names.)
- **Scoped SERVICE tokens only — never operator GCP ADC** (polecat-law #4). A
  `--secrets` profile injects a static service/app token (e.g.
  `COMMUNITY_ADMIN_V2_TOKEN`, a backend API key); short-lived GCP tokens come via
  the separate `--gcp <profile>` mint. Both land in `extraEnv` and compose.
- **If a needed var is absent**, you either weren't dispatched with the right
  `--secrets` profile or the dotenv lacks it — stop and report. Do NOT hardcode a
  fallback or read creds from anywhere else.

Mechanism + profile config: `rigs/gastown-prime/domain/secrets-injection.md` (gt PR #56).

## Failure Modes

| Situation | Action |
|-----------|--------|
| Build fails | Fix it. Do not proceed if it won't compile. |
| Blocked on external | Close bead with --reason="blocked: <details>", run gt exit |
| Context filling | Commit work, push branch, close bead, run gt exit |
| Unsure what to do | Close bead with --reason="unclear: <details>", run gt exit |

## Turn-Note Discipline

Polecats write turn notes to the bead so the mayor can monitor in-flight work and
the archivist can reconstruct decision paths, not just destinations.

a. WHEN TO WRITE — Write a turn note after any meaningful action:
     - Priming complete (read formula context, bead, and domain docs)
     - Discovery pass complete (read files, confirmed or refuted a hypothesis)
     - File edited (any write to the codebase)
     - Test or shell command run and output observed
     - Backtrack (discarded a prior path — include WHY it was discarded)
     - Handoff (mail sent to mayor or other agent, awaiting ACK)
   ```bash
   bd update {{issue}} --notes "turn N: <one-line summary>. <why, if non-obvious>."
   ```

b. WHEN NOT TO WRITE — Skip a turn note for:
     - Pure navigation: ls, grep, glob exploring — the next discovery note covers it
     - Listing files you already confirmed exist
     - Each individual tool call inside a single logical action
   One note per logical action, not per tool call.

c. FORMAT — One line per note. Prefix with "turn N:" using the sequential turn
   number. Append a brief "why" for anything non-obvious (a choice, a backtrack,
   a skip). Never paste diffs or raw tool output into notes — cite file:line or
   a commit SHA instead.
   Example: `turn 3: skipped branch-setup, bridge polecat commits to capitol directly`
   Example: `turn 7: rewrote implement step after finding existing util at lib/fmt.go:42`

d. WHAT TO KEEP OUT — No large diffs, no command output dumps, no stack traces.
   If you need to preserve an error for the mayor, quote the key line only and
   cite the log file. Notes are a semantic trail, not a raw transcript.

e. DISTINCT GRAIN FROM gt EXIT NOTES — Turn notes go on the bead (playback grain).
   `gt exit --notes` writes a findings note to `rigs/<rig>/domain/notes/` for the
   archivist (findings grain). Both are required; neither replaces the other."""
formula = "mol-polecat-work"
version = 16

[[steps]]
id = "load-context"
title = "Load context and verify assignment"
description = """
Initialize your session and understand your assignment.

**1. Prime your environment:**
```bash
gt prime                    # Load role context
bd prime                    # Load beads context
```

**2. Preflight check (validate connectivity):**
```bash
gt hook               # Shows your pinned molecule and hook_bead
bd show {{issue}}           # Validates Dolt connectivity + reads your assignment
```
If `bd show` hangs or fails: run `gt dolt status` to check Dolt health.
If Dolt is down: `gt escalate -s HIGH "Dolt: <symptom>"` — do NOT restart it yourself.

The hook_bead is your assigned issue. Read the output of `bd show` carefully.

**3. Check inbox for additional context:**
```bash
gt mail inbox
# Read any HANDOFF or assignment messages
```

**4. Check for prior merge failure context:**

If the bead notes contain "MERGE REJECTION", a previous polecat's work was
rejected by the refinery. Read the failure details carefully:
- **Failure-Type**: what broke (tests, build, lint, typecheck)
- **Error**: the actual error output
- **Branch**: the previous branch may still exist with the original work

If a prior branch exists, check it out instead of creating a new one:
```bash
git fetch origin
git branch -a | grep <branch-from-notes>
# If it exists: git checkout <branch> && git rebase origin/{{base_branch}}
```

This lets you make a targeted fix rather than starting from scratch.

**5. ORIENT — context-db agent door (do this BEFORE you read source):**

A grep answers "what does this say"; the corpus answers "does this already exist" — and it
usually does. Orienting first is what stops you rebuilding something that already ships.
A grep or a source read is VERIFY-AT-SOURCE — step 3, confirming an exact fact. It is never
step 1, discovering WHETHER the thing exists. That is what orientation answers.

The door works from any cwd: no bridge checkout, no `gcloud run services proxy`, no MCP.
The full recipe — mint, `POST /search`, `GET /map`, section-scoped `GET /concept`, the
filter vocabulary, and the `POST /notes` write-back — is **appended to this step at prime
time** from the town overlay, and is written once in
`formula-overlays/shared/context-db-door.md`.

> **Why the recipe is not pasted here (sbx-gastown-fzzn1).** `gt prime` renders the formula
> compiled into the `gt` binary and applies `<townRoot>/formula-overlays/<name>.toml`
> (`internal/cmd/prime_molecule.go:116,133`). It never reads `.beads/formulas/`. So a copy in
> this file would reach no agent while still being a copy that can drift — and it had already
> drifted across seven files by 2026-08-20. One canonical block, rendered by
> `scripts/sync-formula-overlays.sh`, gated by `scripts/check-formula-overlays.sh`.

If for any reason the block is not in your primed context, the always-current contract is one
call away and needs nothing but the mint:

```bash
CTX=https://context-db-2hazwepeiq-uc.a.run.app
TOKEN=$("${GT_ROOT:-$GT_TOWN_ROOT}"/context-db/scripts/mint-ctx-token.sh --url "$CTX" 2>/dev/null \
        || gcloud auth print-identity-token)   # fallback: NO --audiences (a user ADC cannot scope one)
curl -s -H "Authorization: Bearer $TOKEN" "$CTX/agents"   # the baked AGENTS.md doctrine
```

`GET /agents` → 200 is also the liveness probe; `/healthz` is **404 on the *.run.app URL by
design**, not an outage. A hit is a **MAP, never the value** — verify the exact fact at the
source before you act. **Unreachable?** Fall back to `rigs/$GT_RIG/domain/` — a stopgap, never
a licence to skip orientation and go straight to source.

**6. Understand the requirements:**
- What exactly needs to be done?
- What files are likely involved?
- Are there dependencies or blockers?
- What does "done" look like?
- If this is a rework: what specifically failed and why?

**7. Verify you can proceed:**
- No unresolved blockers on the issue
- You understand what to do
- Required resources are available

If blocked or unclear, note findings on bead and close with reason immediately:
```bash
bd update {{issue}} --notes -s "HELP: Unclear requirements" -m "Issue: {{issue}}
Question: <what you need clarified>"
```

**Exit criteria:** You understand the work and can begin implementation.

When this step is complete, output the marker:
```
STEP_COMPLETE load-context
```"""

[[steps]]
id = "branch-setup"
title = "Set up working branch"
needs = ["load-context"]
description = """
Ensure you're on a clean feature branch ready for work.

**1. Check current branch state:**
```bash
git status
git branch --show-current
```

**2. Decide branching strategy (pick ONE — A, B, or C):**

```bash
git fetch origin
```

**Option A — Extend an existing open PR on `{{base_branch}}`** (when the
bead says "extend PR #N", or when `{{base_branch}}` is itself the head
of an open PR like `bridge/<issue-id>`):

```bash
# Detect: does {{base_branch}} already have an open PR?
gh pr list --head {{base_branch}} --state open --json number,url --limit 1
```

If that command returns a PR, you are EXTENDING it. Do NOT create a new
feature branch — your commits go directly on `{{base_branch}}` so the
existing PR auto-updates on push:

```bash
git checkout {{base_branch}}
git pull --ff-only origin {{base_branch}}
```

Skip Options B and C. Proceed to step 3.

**Why not a stacked PR?** GitHub will auto-merge a stacked PR the moment
its base catches up, creating a confusing second PR and a redundant merge
commit. Pushing directly to `{{base_branch}}` is the bridge convention
when the bead scope is "extend an existing PR."

**Option B — Reuse a rejected-merge prior branch:**

If the bead notes contain "MERGE REJECTION" with a branch name, reuse that
branch — it preserves previous work and review discussion:

```bash
git branch -r | grep <prior-branch>
# If found:
git checkout -b <prior-branch> origin/<prior-branch>
git rebase origin/{{base_branch}}
```

**Option C — Fresh branch (the default):**

Neither A nor B apply — create a new feature branch:

```bash
git checkout -b polecat/<name> origin/{{base_branch}}
```

**3. Ensure clean working state:**
```bash
git status                  # Should show "working tree clean"
git stash list              # Should be empty
```

If dirty state from previous work:
```bash
# If changes are relevant to this issue:
git add -A && git commit -m "WIP: <description>"

# If changes are unrelated cruft:
git stash push -m "unrelated changes before {{issue}}"
# Or discard if truly garbage:
git checkout -- .
```

**4. Sync with {{base_branch}}:**
```bash
git fetch origin
git rebase origin/{{base_branch}}      # Get latest, rebase your branch
```

If rebase conflicts:
- Resolve them carefully
- If stuck, note findings on bead and close with reason

**5. Run project setup (if configured):**

If setup_command is set, run it to install dependencies:
```bash
{{setup_command}}
```

This ensures dependencies are installed before you start work.
Empty setup_command means "not configured" — skip this step.

**Exit criteria:** You're on a clean feature branch, rebased on latest {{base_branch}}, dependencies installed.

When this step is complete, output the marker:
```
STEP_COMPLETE branch-setup
```"""

[[steps]]
id = "implement"
title = "Implement the solution"
needs = ["branch-setup"]
description = """
Do the actual implementation work.

**Working principles:**
- Follow existing codebase conventions
- Make atomic, focused commits
- Keep changes scoped to the assigned issue
- Don't gold-plate or scope-creep
- **Scope is a contract.** The bead description defines what you build. If you believe \
the issue requires work beyond what is described, mail the mayor BEFORE implementing it:
  ```bash
  gt mail send mayor/ -s "Scope question: {{issue}}" -m "I think we also need X because Y. Proceed?"
  ```
  Wait for a response before expanding scope. Do NOT build unrequested features and \
present them as complete.
- **NEVER run `sudo` or install system packages** (apt, dnf, yum, pacman, brew install,
  pip install --system, npm install -g). Use the tools already in your workspace.
  If a dependency is missing, file a bead — do not modify the host OS.

**Persist findings as you go (CRITICAL for session survival):**
Your session can die at any time (context limit, crash, SIGKILL). Code changes
survive in git, but analysis, findings, and decisions exist only in your context
window. Persist them to the bead so they survive session death:
```bash
# After completing significant analysis or reaching conclusions:
bd update {{issue}} --notes "Findings so far: <what you discovered>"
# For detailed reports, use --design:
bd update {{issue}} --design "<structured findings>"
```
Do this BEFORE closing molecule steps, not after. If your session dies between
persisting and closing, the findings survive. If you close first, they're lost.

**For report-only tasks** (audits, reviews, research): your findings ARE the
deliverable. There are no code changes to commit. You MUST persist all findings
to the bead via --notes or --design. Without this, your entire work product is
lost when the session ends.

**Commit frequently (for code tasks):**
```bash
# After each logical unit of work:
git add <files>
git commit -m "<type>: <description> ({{issue}})"
```

Commit types: feat, fix, refactor, test, docs, chore

**Discovered work:**
If you find bugs or improvements outside your scope:
```bash
bd create --title "Found: <description>" --type bug --priority 2
# Note the ID, continue with your work
```

Do NOT fix unrelated issues in this branch.

**If stuck:**
Don't spin for more than 15 minutes. Mail Witness:
```bash
bd update {{issue}} --notes -s "HELP: Stuck on implementation" -m "Issue: {{issue}}
Trying to: <what you're attempting>
Problem: <what's blocking you>
Tried: <what you've attempted>"
```

**Exit criteria (HARD GATE):** Implementation complete AND code committed to git.
- Code tasks: `git status` shows clean working tree, `git log origin/{{base_branch}}..HEAD` shows at least 1 commit
- Report tasks: all findings persisted to bead via --notes or --design
Do NOT proceed to the next step with uncommitted changes.

When this step is complete, output the marker:
```
STEP_COMPLETE implement
```"""

[[steps]]
id = "commit-changes"
title = "Commit all implementation changes"
needs = ["implement"]
description = """
Ensure ALL implementation work is committed IMMEDIATELY after implementation.
This step exists to prevent the #1 polecat failure mode: context exhaustion
before code is committed. Commit NOW, review and build AFTER.

**CRITICAL: You MUST commit all changes from implementation.**
NEVER use `git checkout -- .` or `git restore .` to discard implementation work.
ALWAYS commit ALL uncommitted changes from your implementation.

**1. Check for uncommitted changes:**
```bash
git status
```

**2. If there are ANY uncommitted changes, commit them now:**
```bash
git add -A && git commit -m "<type>: <descriptive message> ({{issue}})"
```

**3. If working tree is already clean, that's fine — but you MUST still have commits (step 4).**

**4. VERIFY commits exist (HARD GATE — do NOT close this step without passing):**
```bash
git log origin/{{base_branch}}..HEAD --oneline
```

This MUST show at least 1 commit. If it shows NOTHING:
- You have NOT completed your implementation. Do NOT close this step.
- Go back to the implement step and do the work.
- If the task genuinely requires no code changes (already fixed upstream, etc.),
  close the bead with `bd close {{issue}} --reason="no-changes: <explanation>"` and run `gt exit`.
- Do NOT proceed to review or build with zero commits.

**5. VERIFY clean working tree:**
```bash
git status
```
Must show "nothing to commit, working tree clean".

**Report-only tasks (audits, reviews, research — no code changes):**
If your task produced no code changes, verify your findings are persisted to the bead:
```bash
bd show {{issue}}    # Check notes/design fields have your findings
```
If findings are persisted, proceed to review. Report-only tasks with findings
persisted can skip commit verification.

**Exit criteria:** Working tree clean AND either (a) at least 1 commit ahead of origin/{{base_branch}}, or (b) report-only task with findings persisted to bead.

When this step is complete, output the marker:
```
STEP_COMPLETE commit-changes
```"""

[[steps]]
id = "self-review"
title = "Self-review changes"
needs = ["commit-changes"]
description = """
Review your own changes before the build check. Use `/review --branch` for
structured grading, or do a manual review.

**Option A: Use /review (recommended)**
```bash
/review --branch
```
This gives you a structured grade (A-F) with CRITICAL/MAJOR/MINOR findings
and specific fix suggestions. Fix any CRITICAL or MAJOR issues before proceeding.

**Option B: Manual review**

**1. Review the diff:**
```bash
git diff origin/{{base_branch}}...HEAD     # All changes vs {{base_branch}}
git log --oneline origin/{{base_branch}}..HEAD  # All commits
```

**2. Check for common issues:**

| Category | Look For |
|----------|----------|
| Bugs | Off-by-one, null handling, edge cases |
| Security | Injection, auth bypass, exposed secrets |
| Style | Naming, formatting, code organization |
| Completeness | Missing error handling, incomplete paths |
| Cruft | Debug prints, commented code, TODOs |

**3. Fix issues found:**
Don't just note them - fix them now. Amend or add commits as needed.

**4. Verify no unintended changes:**
```bash
git diff --stat origin/{{base_branch}}...HEAD
# Only files relevant to {{issue}} should appear
```

If you accidentally modified unrelated files, remove those changes.

**Exit criteria:** Changes are clean, reviewed (Grade B or better if using /review),
and ready for build check.

When this step is complete, output the marker:
```
STEP_COMPLETE self-review
```"""

[[steps]]
id = "build-check"
title = "Build and sanity check"
needs = ["self-review"]
description = """
Verify your changes compile and pass basic sanity checks. The Refinery's
bisecting merge queue runs the full test suite — your job is to catch
obvious problems fast so you don't waste the MQ's time.

**1. Build (REQUIRED — must pass):**

If build_command is set:
```bash
{{build_command}}
```

If setup_command is set (ensure new deps are installed):
```bash
{{setup_command}}
```

If typecheck_command is set:
```bash
{{typecheck_command}}
```

Empty commands mean "not configured" — skip silently.

**2. If build fails:**
- Fix it. Return to implement step if needed.
- Do NOT submit broken code to the merge queue.

**3. Targeted tests (OPTIONAL — run if fast and relevant):**

If you modified or added test files, run those specific tests to catch
obvious regressions. Do NOT run the full test suite — that's the
Refinery's job.

```bash
# Example: run only tests in packages you changed
go test ./internal/pkg/you/changed/...
# Or for JS: npx jest --testPathPattern="changed-file"
```

If you're unsure which tests are relevant, skip this — the MQ will catch it.

**4. Lint (OPTIONAL — run if configured and fast):**

If lint_command is set:
```bash
{{lint_command}}
```

**Exit criteria:** Code compiles. Obvious regressions caught. Ready to submit.

When this step is complete, output the marker:
```
STEP_COMPLETE build-check
```"""

[[steps]]
id = "pre-verify"
title = "Pre-merge rebase verification"
needs = ["build-check"]
description = """
Rebase onto the target branch and run the full gate suite. This ensures
your PR is clean and ready for review on the latest base.

**1. Fetch and rebase onto target:**
```bash
git fetch origin {{base_branch}}
git rebase origin/{{base_branch}}
```

If rebase conflicts:
- Resolve them carefully
- Re-run the build to ensure the resolution is correct
- If stuck, note findings on bead and close with reason

**2. Run the full gate suite on the rebased result:**

Run ALL configured gates (not just targeted tests — this is the full verification):

If build_command is set:
```bash
{{build_command}}
```

If typecheck_command is set:
```bash
{{typecheck_command}}
```

If lint_command is set:
```bash
{{lint_command}}
```

If test_command is set:
```bash
{{test_command}}
```

Empty commands mean "not configured" — skip silently.

**3. If any gate fails after rebase:**
- Fix the issue, commit, and re-run from step 1
- Do NOT proceed with --pre-verified if gates failed

**4. If all gates pass:**
You are ready to submit your PR in the next step.

**Note:** If this step takes too long or the gates are not configured for this
project, you may skip this step and proceed to submit your PR.
The reviewer will verify gates in CI.

**Exit criteria:** Branch rebased onto latest origin/{{base_branch}}, all configured gates pass.

When this step is complete, output the marker:
```
STEP_COMPLETE pre-verify
```"""

[[steps]]
id = "submit-and-exit"
title = "Submit PR and exit"
needs = ["pre-verify"]
description = """
Push your branch and create a GitHub PR. You are done after this step.

**Pre-flight: Verify you have actual work to submit (HARD GATE):**
```bash
git log origin/{{base_branch}}..HEAD --oneline
```
This MUST show at least 1 commit. If it shows nothing, you have no work to submit.

**For report-only tasks (no commits — audits, reviews, research):**
```bash
bd update {{issue}} --notes "Report complete: findings persisted to bead notes/design"
gt exit
```

**For code tasks — push and (maybe) create a PR:**

```bash
# 1. Push your branch
git push -u origin HEAD
```

**2. PR handling — depends on the branching strategy you chose in `branch-setup`:**

**If you chose Option A (extending an existing PR on `{{base_branch}}`):**

The existing PR auto-updates from your push. DO NOT run `gh pr create` —
a second PR against the same head creates duplicates. Just record the
existing PR's URL:

```bash
PR_URL=$(gh pr list --head {{base_branch}} --state open --json url \
           --limit 1 --jq '.[0].url')
echo "Extended existing PR: $PR_URL"
```

If `$PR_URL` is empty, your branching assumption was wrong — fall through
to Option B/C path below and open a new PR.

**If you chose Option B or C (you're on your own feature branch):**

```bash
gh pr create --base {{base_branch}} --title "<type>: <short description> ({{issue}})" --body "## Summary
<what was done and why>

## Test plan
- <how this was verified>

Bead: {{issue}}"
```

You should see output like:
```
https://github.com/<org>/<repo>/pull/<number>
```

**3. Create a foreman bead to track the PR review conversation:**
```bash
bd create --title "Foreman: PR review for {{issue}}" --type task --priority 2 \
  --labels "<rig-label>" \
  --description "pr_url: <the PR URL from step 2>
source_bead: {{issue}}
role: foreman
formula: mol-foreman-pr-response"
```

**4. Save and exit (do NOT close the bead):**
```bash
gt exit --notes "PR created: <PR URL>. Foreman bead: <foreman-bead-id>. Summary: <what was done>"
```

`gt exit` auto-commits any uncommitted work, pushes the branch, persists your notes
to the bead, and exits. It's the safety net — your work is never lost even if you
forgot to commit.

**`gt exit` is a DELIVERABLE, not an epilogue (sbx-gastown-vf98i).** It is the
thing that releases your hook and lets the reaper reclaim your slot. Because it
is invisible in PR-space — the PR looks identical whether or not you ran it —
it is the step most often dropped. A dozen polecats on 2026-08-11 pushed,
opened their PR, and then sat idle forever holding a worktree and a tmux
session; several NARRATED an exit they never performed. Saying you exited is
not exiting. Run the command and read its output.

**Do NOT close your bead.** The archivist closes it after extracting domain knowledge
from your work. Your bead stays open as a signal that post-processing is pending.
An open bead is not an unfinished job — do not let it keep you here.

**What happens next (not your concern):**
- The daemon detects your open bead + exited session → spawns an archivist
- The archivist extracts knowledge into domain docs and closes your bead
- The foreman handles PR review comments
- The daemon reaper cleans up your worktree

You are NOT involved in any of that. Your PR is one OUTPUT of this bead; the
bead's deliverables are the PR **and** your persisted findings **and** the exit.

**Exit criteria:** Branch pushed, PR created, `git log @{u}..HEAD` empty, and
`gt exit` actually run (not described).

When this step is complete, output the marker:
```
STEP_COMPLETE submit-and-exit
```"""

[vars]
[vars.issue]
description = "The issue ID assigned to this polecat"
required = true

[vars.base_branch]
description = "The base branch to rebase on and compare against (e.g., main, integration/epic-id)"
default = "main"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.test_command]
description = "Command to run tests (auto-detected from rig settings)"
default = ""

[vars.lint_command]
description = "Command to run linting. Empty = skip."
default = ""

[vars.build_command]
description = "Command to run build. Empty = skip."
default = ""
