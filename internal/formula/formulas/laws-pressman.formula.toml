## Cross-platform scripting discipline

Pressman scripts run on Windows print servers under PowerShell 5.1, which
reads no-BOM UTF-8 files as Windows-1252 by default. Multi-byte UTF-8
sequences get mis-decoded into Windows-1252 chars, and some of those chars
terminate strings -- producing cascading "missing terminator" + "missing
closing }" parse errors pointing at lines far below the actual offending
character.

Classic bite: em-dash `--` is UTF-8 bytes `E2 80 94`. Read as CP1252,
the third byte is `0x94` -- a closing quote. The string terminates
mid-line; the parser sees the rest as code; the script won't load.

When you (or an extension polecat) write any file destined to run on
Windows -- `.ps1`, `.bat`, anything PowerShell 5.1 might parse -- keep
STRING LITERALS to ASCII only. Substitute:

- em-dash -> `--`
- en-dash -> `-`
- section sign -> `sec.`
- curly quotes -> straight `"` or `'`
- non-breaking space -> regular space

Comments are usually safe but stay ASCII defensively. After writing,
verify:

    LC_ALL=C grep -nP '[^\\x00-\\x7f]' <file>

Read it as PASS/FAIL only -- any output at all is a fail. Do NOT use it to
COUNT: under `LC_ALL=C` it matches single BYTES, so one 3-byte em-dash
scores as three, and every multi-byte character collapses into the same
undifferentiated tally. For a real count (and a per-character breakdown)
use `python3 -c "..."` over `ord(c) > 127`.

This rule mirrors `laws-polecat` law #11. It applies equally to:
- Bridge polecats writing Pressman extensions (the common case -- the
  operator dispatches a polecat from macOS, the polecat happily emits
  em-dashes, the file fails to parse on the Windows print server).
- The Pressman itself when drafting note content that includes PowerShell
  snippets (notes are markdown, so non-ASCII in prose is fine, but
  fenced PS code blocks should be ASCII).

The launcher's `Run-NativeScript` parse-checks every script before invoking
it (`pressman.ps1` -- `[Parser]::ParseFile`), so this kind of failure surfaces
clearly with the line number. If the operator hits it, the fix path is:
(a) operator escalates to mayor with the parse error, (b) mayor fixes
the offending file, (c) operator re-pulls the bridge.

