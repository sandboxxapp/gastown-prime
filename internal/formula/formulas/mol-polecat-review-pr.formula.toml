description = """
Review an external PR and decide on merge/reject/revise.

This molecule guides a polecat through reviewing a pull request from an external
contributor. The polecat reviews code quality, tests, and alignment with project
standards, then approves, requests changes, or files followup beads.

## Polecat Contract (Self-Cleaning Model)

You are a self-cleaning worker. You:
1. Receive work via your hook (pinned molecule + PR reference)
2. Work through molecule steps using `bd mol current` / `bd close <step>`
3. Complete and self-clean via `gt done` (submit findings + nuke yourself)
4. You are GONE - your review is recorded in beads

**Self-cleaning:** When you run `gt done`, you submit your findings, nuke your
sandbox, and exit. There is no idle state. Done means gone.

**Important:** This formula defines the template. Your molecule already has step
beads created from it. Use `bd mol current` to find them - do NOT read this file directly.

**You do NOT:**
- Merge the PR yourself (maintainer or Refinery does that)
- Push to the PR branch (it's external)
- Wait for contributor response (you're done after review)

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| pr_url | hook_bead | The PR URL to review |
| issue | hook_bead | The tracking issue for this review task |

## Failure Modes

| Situation | Action |
|-----------|--------|
| PR is stale/unmergeable | Note in review, request rebase |
| Tests fail | Note in review, request fixes |
| Major issues found | File followup beads, request changes |
| Unclear requirements | Mail Witness for guidance |"""
formula = "mol-polecat-review-pr"
version = 1

[[steps]]
id = "load-context"
title = "Load context and understand the PR"
description = """
Initialize your session and understand the PR you're reviewing.

**1. Prime your environment:**
```bash
gt prime                    # Load role context
bd prime                    # Load beads context
```

**2. Check your hook:**
```bash
gt hook               # Shows your pinned molecule and hook_bead
```

The hook_bead references the PR to review. Read the tracking issue:
```bash
bd show {{issue}}           # Full issue details including PR URL
```

**3. Fetch the PR:**
```bash
gh pr view {{pr_url}} --json title,body,author,files,commits
gh pr diff {{pr_url}}       # See the actual changes
```

**4. Understand the PR:**
- What is the PR trying to accomplish?
- What files are changed?
- Is there a linked issue?
- Does the PR description explain the "why"?

**5. Check PR status:**
```bash
gh pr checks {{pr_url}}     # CI status
gh pr view {{pr_url}} --json mergeable,reviewDecision
```

**Exit criteria:** You understand the PR's purpose and scope."""

[[steps]]
id = "review-code"
title = "Review the code changes"
needs = ["load-context"]
description = """
Perform a thorough code review of the PR.

**1. Review the diff systematically:**
```bash
gh pr diff {{pr_url}}
```

**2. Check for common issues:**

| Category | Look For |
|----------|----------|
| Correctness | Logic errors, edge cases, null handling |
| Security | Injection, auth bypass, exposed secrets |
| Style | Naming, formatting, consistency with codebase |
| Tests | Are changes tested? Do tests cover edge cases? |
| Docs | Are docs updated if needed? |
| Scope | Does PR stay focused? Any scope creep? |

**3. For each file changed:**
- Does the change make sense?
- Is it consistent with existing patterns?
- Are there any red flags?

**4. Note issues found:**
Keep a running list of:
- Blocking issues (must fix before merge)
- Suggestions (nice to have)
- Questions (need clarification)

**Exit criteria:** You have reviewed all changes and noted issues."""

[[steps]]
id = "check-tests"
title = "Verify tests and CI"
needs = ["review-code"]
description = """
Ensure tests pass and coverage is adequate.

**1. Check CI status:**
```bash
gh pr checks {{pr_url}}
```

All required checks should pass. If not, note which are failing.

**2. Review test changes:**
- Are there new tests for new functionality?
- Do tests cover edge cases?
- Are tests readable and maintainable?

**3. If tests are missing:**
Note this as a blocking issue - new code should have tests.

**4. Check for test-only changes:**
If PR is test-only, ensure tests are meaningful and not just
padding coverage numbers.

**Exit criteria:** You've verified test status and coverage."""

[[steps]]
id = "make-decision"
title = "Decide: approve, request changes, or needs discussion"
needs = ["check-tests"]
description = """
Make your review decision.

**Decision matrix:**

| Situation | Decision |
|-----------|----------|
| Clean code, tests pass, good scope | APPROVE |
| Minor issues, easily fixed | REQUEST_CHANGES (with specific feedback) |
| Major issues, needs rework | REQUEST_CHANGES (with detailed explanation) |
| Unclear requirements or scope | NEEDS_DISCUSSION (mail Witness) |
| Security concern | BLOCK (mail Witness immediately) |

**1. If APPROVE:**
The PR is ready to merge. Note any minor suggestions as comments
but don't block on them.

**2. If REQUEST_CHANGES:**
Be specific about what needs to change. Provide examples if helpful.
The contributor should be able to act on your feedback.

**3. If NEEDS_DISCUSSION:**
```bash
gt mail send {{rig}}/witness -s "PR review needs discussion" -m "PR: {{pr_url}}
Issue: {{issue}}
Question: <what needs clarification>"
```

**4. If BLOCK (security):**
```bash
gt mail send {{rig}}/witness -s "SECURITY: PR blocked" -m "PR: {{pr_url}}
Issue: {{issue}}
Concern: <security issue found>"
```

**Exit criteria:** You've made a clear decision with rationale."""

[[steps]]
id = "submit-review"
title = "Post the review content to the PR (and record on the bead)"
needs = ["make-decision"]
description = """
Your review verdict is worthless if a maintainer can't see it. The deliverable of
this step is a **comment ON THE PR** carrying the full substance of your review —
not a one-line approval stamp, and not only a note buried on the tracking bead.

> **The rule:** the review CONTENT must reach the PR. Always. Recording it on the
> bead is a backstop, not a substitute. NEVER silently skip the PR post.

## 1. Assemble the review comment body

Compose the full review content as markdown. It MUST include, at minimum:

- **Verdict:** `APPROVE` / `REQUEST_CHANGES` / `NEEDS_DISCUSSION` (from make-decision)
- **Rationale:** why you reached that verdict
- **Per-finding detail:** each issue found, with file:line attribution and whether
  it is blocking, a suggestion, or a question
- **Operator-decision items:** ANYTHING a maintainer must sign off on before merge
  (tradeoffs, scope calls, risk acceptance). Call these out explicitly under a
  clearly-labeled section — this is the part a human must act on.
- **Test assessment:** CI status + whether coverage is adequate
- **Follow-up beads:** IDs of any beads you'll file (or filed) in the next step

**Header the comment** so it reads as a relayed Gastown review:

```
🤖 Gastown review — <VERDICT> (tracking {{issue}})
```

Write the body to a file to avoid shell-quoting hazards with multi-line content:

```bash
cat > /tmp/gastown-review-{{issue}}.md <<'EOF'
🤖 Gastown review — REQUEST_CHANGES (tracking {{issue}})

## Verdict
REQUEST_CHANGES

## Rationale
<why>

## Findings
- [BLOCKING] path/to/file.go:42 — <detail>
- [SUGGESTION] ...
- [QUESTION] ...

## Operator decisions required
- <thing the maintainer must sign off on before merge>

## Tests
<CI status + coverage assessment>

## Follow-ups
- <bead-id>: <title>
EOF
```

## 2. Determine identity (KbotSB preferred, operator fallback)

The review-bot identity is **KbotSB** (`mayor/credentials/kbotsb.token`). Prefer it
when it authenticates AS the bot. But as of this writing KbotSB authenticates as the
OPERATOR, not the bot (escalation sbx-gastown-tzpay) — so a genuine bot path is often
unavailable. Detect the current identity before deciding how to post:

```bash
gh auth status   # shows the logged-in account for the active token
```

- **Bot path available** — the active identity IS the KbotSB bot account:
  you MAY post a formal review STATE in addition to the comment (see step 3).
- **Fallback (operator identity)** — the active identity is the operator (the tzpay
  state), or KbotSB is otherwise unavailable: post the review CONTENT via
  `gh pr comment` under whatever identity is available. Operator-identity comments
  are **explicitly acceptable** as the interim behavior until the KbotSB fix lands.

Either way, the content comment gets posted. There is no branch where the PR
receives nothing.

## 3. Post the content comment (ALWAYS)

```bash
gh pr comment {{pr_url}} --body-file /tmp/gastown-review-{{issue}}.md
```

This is the mandatory deliverable and runs on BOTH the bot path and the fallback.

**Formal review STATE — bot path ONLY.** Only when step 2 confirmed the genuine
KbotSB bot identity, you MAY additionally submit a formal review state:

```bash
# ONLY when authenticated as the KbotSB bot:
gh pr review {{pr_url}} --approve         --body-file /tmp/gastown-review-{{issue}}.md   # APPROVE
gh pr review {{pr_url}} --request-changes --body-file /tmp/gastown-review-{{issue}}.md   # REQUEST_CHANGES
gh pr review {{pr_url}} --comment         --body-file /tmp/gastown-review-{{issue}}.md   # NEEDS_DISCUSSION
```

> ⚠️ Do NOT run `gh pr review --approve/--request-changes` under the OPERATOR
> identity. GitHub rejects self-approval and a formal state under the wrong identity
> is misleading. Under the fallback, the `gh pr comment` post from above is the
> complete deliverable — do not attempt a formal review state.

## 4. Record the verdict on the tracking bead (backstop — ALWAYS)

Independently of the PR post, always record the verdict on {{issue}} so it survives
even if the PR post fails:

```bash
bd update {{issue}} --notes "Review posted to PR {{pr_url}}. Verdict: <APPROVE|REQUEST_CHANGES|NEEDS_DISCUSSION>. Identity: <kbotsb-bot|operator-fallback>."
```

**Exit criteria:** The full review CONTENT is a comment on the PR (verified with
`gh pr view {{pr_url}} --comments`), and the verdict is recorded on {{issue}}."""

[[steps]]
id = "file-followups"
title = "File beads for any followup work"
needs = ["submit-review"]
description = """
Create beads for any followup work discovered during review.

**1. For issues found that are outside PR scope:**
```bash
bd create --type=bug --title="Found during PR review: <description>" \
  --description="Discovered while reviewing {{pr_url}}.

  <details of the issue>"
```

**2. For improvements suggested but not required:**
```bash
bd create --type=task --title="Improvement: <description>" \
  --description="Suggested during review of {{pr_url}}.

  <details of the improvement>"
```

**3. Update the tracking issue:**
```bash
bd update {{issue}} --notes "Review complete. Decision: <APPROVE|REQUEST_CHANGES|etc>
Followups filed: <list of bead IDs if any>"
```

**4. Sync beads:**
```bash
bd sync
```

**Exit criteria:** All followup work captured as beads."""

[[steps]]
id = "complete-and-exit"
title = "Complete review and self-clean"
needs = ["file-followups"]
description = """
Signal completion and clean up. You cease to exist after this step.

**Self-Cleaning Model:**
Once you run `gt done`, you're gone. The command:
1. Syncs beads
2. Nukes your sandbox
3. Exits your session immediately

**Run gt done:**
```bash
bd sync
gt done
```

**What happens next (not your concern):**
- Maintainer or Refinery acts on your review
- Contributor responds to feedback
- PR gets merged, revised, or closed

You are NOT involved in any of that. You're gone. Done means gone.

**Exit criteria:** Beads synced, sandbox nuked, session exited."""

[vars]
[vars.pr_url]
description = "The PR URL to review"
required = true

[vars.issue]
description = "The tracking issue for this review task"
required = true

[vars.rig]
description = "The rig this PR review is for"
required = true
