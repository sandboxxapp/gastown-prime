description = """
Review an external PR and return ONE verdict from a closed set.

This molecule guides a polecat through reviewing a pull request from an external
contributor. The polecat reviews code quality, tests, and alignment with project
standards, then returns exactly one of **APPROVE**, **REQUEST_CHANGES**, or
**NEEDS_DISCUSSION** — with any non-blocking findings filed as followup beads
whose ids are named in the verdict line.

> 🛑 **There is no "APPROVE WITH CHANGES".** Either it needs changes now
> (REQUEST_CHANGES), or it is approved with followups (APPROVE + bead ids).
> Operator ruling 2026-09-11; the reasoning is in the make-decision step.

## Polecat Contract (Self-Cleaning Model)

You are a self-cleaning worker. You:
1. Receive work via your hook (pinned molecule + PR reference)
2. Work through molecule steps using `bd mol current` / `bd close <step>`
3. Complete and self-clean via `gt exit` (persist findings + release the slot)
4. You are GONE - your review is recorded in beads

**Self-cleaning:** When you run `gt exit`, you push, persist a completion note
to the bead, and exit. The daemon reaper reclaims your worktree and session.
There is no idle state. Done means gone.

**The verb is `gt exit`, NOT `gt done` (sbx-gastown-vf98i).** This formula said
`gt done` until 2026-08-12, and that was a real bug, not a synonym: `gt done`
submits to a merge queue and "transitions polecat to IDLE (sandbox preserved,
session stays alive for reuse)". This town runs the dispatch-and-kill model,
where no merge queue is involved and the slot must be RELEASED. A reviewer who
ran `gt done` exactly as instructed still ended up idle, holding a worktree and
a tmux session — which is precisely the failure the mayor hand-cleaned a dozen
times on 2026-08-11. `gt exit` is what every other bridge role formula uses.

**Important:** This formula defines the template. Your molecule already has step
beads created from it. Use `bd mol current` to find them - do NOT read this file directly.

**You do NOT:**
- Merge the PR yourself (the mayor/operator does that)
- Push to the PR branch (it's external)
- Wait for contributor response (you're done after review)
- Close your own bead (the archivist closes it after knowledge extraction)

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| pr_url | hook_bead | The PR URL to review |
| issue | hook_bead | The tracking issue for this review task |

## Failure Modes

| Situation | Action |
|-----------|--------|
| PR is stale/unmergeable | Note in review, request rebase |
| Tests fail | Note in review, request fixes |
| One of the four REQUEST_CHANGES triggers fired | REQUEST_CHANGES, naming which trigger |
| Findings that do not block the merge | APPROVE + followup beads, ids in the verdict line |
| Unclear requirements | Mail Witness for guidance |"""
formula = "mol-polecat-review-pr"
version = 9

[[steps]]
id = "load-context"
title = "Load context and understand the PR"
description = """
Initialize your session and understand the PR you're reviewing.

**1. Prime your environment:**
```bash
gt prime                    # Load role context
bd prime                    # Load beads context
```

**2. Check your hook:**
```bash
gt hook               # Shows your pinned molecule and hook_bead
```

The hook_bead references the PR to review. Read the tracking issue:
```bash
bd show {{issue}}           # Full issue details including PR URL
```

**3. Fetch the PR:**
```bash
gh pr view {{pr_url}} --json title,body,author,files,commits
gh pr diff {{pr_url}}       # See the actual changes
```

**4. Understand the PR:**
- What is the PR trying to accomplish?
- What files are changed?
- Is there a linked issue?
- Does the PR description explain the "why"?

**5. Check PR status:**
```bash
gh pr checks {{pr_url}}     # CI status
gh pr view {{pr_url}} --json mergeable,reviewDecision
```

**Exit criteria:** You understand the PR's purpose and scope."""

[[steps]]
id = "domain-context"
title = "Orient on the PR's domain (context-db)"
needs = ["load-context"]
description = """
Before reviewing, orient on the PR's domain. Domain context is how you catch incorrect
business logic a pure code read would miss. Orient BEFORE you read the diff — once you have
read the diff you are anchored to the author's framing, and orientation degrades into
confirming it.

**You are the town's ONE domain-judgement seat on this PR.** The foreman that handles the
review conversation afterwards is deliberately corpus-blind: it inherits its domain context
from YOUR comments and from the originating bead, and it escalates rather than re-deriving
(sbx-gastown-fzzn1). So a domain concern you leave unstated here does not get caught later —
it gets implemented. Write the "why" into the review, not just the verdict.

Skim the primed "Retrieved Domain Context (orientation only)" block, then pull more through
the **context-db agent door**. Works from any cwd: no bridge checkout, no
`gcloud run services proxy`, no MCP. (Do NOT use `ctx query` — `ctx` is not on PATH in a
dispatched session; that door is dead.)

The full recipe — the injected token, `POST /search`, `GET /map`, section-scoped `GET /concept`, the filter
vocabulary, and the `POST /notes` write-back — is written once in
`formula-overlays/shared/context-db-door.md` and injected at prime time by the town overlay.

> ⚠️ **Where you will actually see it (sbx-gastown-fzzn1).** `gt prime` renders the formula
> compiled into the `gt` binary plus `<townRoot>/formula-overlays/<name>.toml`
> (`internal/cmd/prime_molecule.go:116,133`); it never reads `.beads/formulas/`. Until
> 2026-08-20 the embedded copy of THIS formula was v1 with no `domain-context` step at all,
> so the door block only ever reached you appended to **`load-context`** by
> `formula-overlays/mol-polecat-review-pr.toml`. The embed refresh (`sbx-gastown-0uzpg`)
> landed this step in the binary; the overlay still appends the recipe and remains the
> delivery path. Do NOT paste the recipe body back in here — that duplicates it against the
> overlay and re-opens the drift this bead closed. Editing `.beads/formulas/` alone still
> reaches nobody: a formula change is only live once `gt` is rebuilt and reinstalled.

If the block is not in your primed context, the always-current contract is one call away:

```bash
CTX="$CONTEXT_DB_URL"; TOKEN="$CONTEXT_DB_TOKEN"   # INJECTED by gt sling — never mint (laws-polecat #0/#4)
curl -s -H "Authorization: Bearer $TOKEN" "$CTX/agents"   # the baked AGENTS.md doctrine
```

`GET /agents` is **not** a liveness probe — it has 503'd while reads served (`sbx-gastown-yd4as`);
probe with `POST /search`. `/healthz` is **404 on the *.run.app URL by design**, not an outage.
**Unreachable?** Fall back to `rigs/$GT_RIG/domain/` — a stopgap,
never a licence to skip orientation and go straight to the diff.

Orientation only: a concept tells you where to LOOK, not what's true now — confirm any
exact/current fact against the live code + the PR diff before an approval or change-request
(the live source wins).

**Feed back what you learned.** A durable review finding goes to `POST $CTX/notes` (see the
injected block). You cannot set `note_sources` — `NoteRequest` is `{body, agent, rig, topic}`
only (`context-db/api/app.py:413-420`); the archivist stamps `foreman-review` on a review-stream
note at fold time. And if ORIENTATION itself misfired, that is its own note, topic prefixed
`context-db usage/orientation feedback`.

**Exit:** oriented on the PR's domain, know how to query the agent door for more. No artifact."""

[[steps]]
id = "review-code"
title = "Review the code changes"
needs = ["domain-context"]
description = """
Perform a thorough code review of the PR.

**1. Review the diff systematically:**
```bash
gh pr diff {{pr_url}}
```

**2. Check for common issues:**

| Category | Look For |
|----------|----------|
| Correctness | Logic errors, edge cases, null handling |
| Security | Injection, auth bypass, exposed secrets |
| Style | Naming, formatting, consistency with codebase |
| Tests | Are changes tested? Do tests cover edge cases? |
| Docs | Are docs updated if needed? |
| Scope | Does PR stay focused? Any scope creep? |

**3. For each file changed:**
- Does the change make sense?
- Is it consistent with existing patterns?
- Are there any red flags?

**4. Note issues found, ALREADY SORTED into the two buckets:**

Classify as you go — the sort is the hard part of the verdict, and doing it at
the end is how reviewers end up reaching for a middle state.

- **BLOCKING** — must change before merge. Only if it is one of the four
  triggers named in make-decision: a defect that reaches users; a false claim
  baked into code or a permanent comment; a guard that would let a real
  regression through undetected; a measurement the PR's argument rests on that
  does not reproduce.
- **FOLLOWUP** — real, worth fixing, does not block. Style, naming, an edge case
  that does not reach users, a refactor you would prefer. These become beads and
  an APPROVE, not a block.
- **QUESTION** — you need clarification to classify it at all.

**Exit criteria:** You have reviewed all changes, and every issue found is in
exactly one of those three buckets."""

[[steps]]
id = "check-tests"
title = "Verify tests and CI"
needs = ["review-code"]
description = """
Ensure tests pass and coverage is adequate.

**1. Check CI status:**
```bash
gh pr checks {{pr_url}}
```

All required checks should pass. If not, note which are failing.

**2. Review test changes:**
- Are there new tests for new functionality?
- Do tests cover edge cases?
- Are tests readable and maintainable?

**3. If tests are missing:**
New code should have tests — but "missing tests" is not automatically BLOCKING.
It blocks only if it meets trigger 3 from make-decision: the PR ships a guard
that would let a real regression through undetected (including a test that
passes whether or not the bug is present). Untested code that is otherwise
correct and low-risk is a FOLLOWUP bead on an APPROVE.

**4. Check for test-only changes:**
If PR is test-only, ensure tests are meaningful and not just
padding coverage numbers.

**Exit criteria:** You've verified test status and coverage."""

[[steps]]
id = "make-decision"
title = "Decide the verdict: APPROVE, REQUEST_CHANGES, or NEEDS_DISCUSSION"
needs = ["check-tests"]
description = """
Reach exactly ONE verdict, from a closed set of three (plus a security stop).

> 🛑 **"APPROVE WITH CHANGES" IS NOT A VERDICT.** Neither GitHub nor this town
> understands it. Operator ruling 2026-09-11: *"approve with changes is not an
> acceptable review status — either it needs changes now, or it's approved with
> followups."*
>
> A middle state forces the mayor to guess between merging and dispatching a
> foreman, and that guess has been wrong. PR #2915 got a wasted foreman round for
> findings its own reviewer described as "test-side, neither a wrong-merge, no
> code change required, the merge warrant is intact" — an APPROVE all along. One
> burned polecat and a delayed merge.
>
> If you catch yourself writing "approve with changes", "approve modulo", "LGTM
> with nits", or "approve but" — you mean **APPROVE + followup beads**. Say that
> instead, and name the bead ids.

**Decision matrix:**

| Situation | Verdict |
|-----------|---------|
| Clean code, tests pass, good scope | APPROVE |
| Minor issues, easily fixed, nothing that MUST change before merge | **APPROVE**, plus a followup bead for each, ids named in the verdict line |
| Something that MUST change before merge (one of the four triggers below) | REQUEST_CHANGES |
| You cannot tell whether it is right — requirements or scope unclear | NEEDS_DISCUSSION (mail Witness) |
| Security concern | BLOCK (mail Witness immediately) |

## REQUEST_CHANGES is reserved. These four triggers are the whole list.

Block the merge ONLY when the PR as it stands contains one of:

1. **A defect that reaches users.** Wrong behavior, data loss, a crash, a
   regression that ships.
2. **A FALSE CLAIM baked into code or a permanent comment.** A comment, doc,
   error string, or test name asserting something the code does not do. It
   outlives the PR and misleads every later reader.
3. **A guard that would let a real regression through undetected.** A test that
   passes whether or not the bug is present, an assertion on the wrong thing, a
   check that cannot fail.
4. **A measurement the PR's argument rests on that does not reproduce.** The PR
   justifies itself with a number, a benchmark, or a count, and you could not
   get it.

Everything else is a **followup bead on an APPROVE**, not a block: style,
naming, a missing edge case that does not reach users, a test you would have
written differently, a refactor you would prefer, a doc you would like expanded.

**Why this matrix changed (sbx-gastown-84iet2).** The old matrix mapped "minor
issues, easily fixed" to REQUEST_CHANGES — so a reviewer who found a nit was
instructed to block a mergeable PR. Faced with a PR that was clearly mergeable
but not spotless, reviewers split the difference and invented a third verdict.
The middle state was a rational response to a matrix with no
"approve with followups" row. This is that row.

## 1. If APPROVE with no followups

The PR is ready to merge. Proceed to the next step.

## 2. If APPROVE WITH FOLLOWUPS — file the beads NOW

The merge warrant is intact AND you found things worth fixing later. File a bead
for each one **in this step**, before you post anything: the verdict line must
name the ids, and a followup that exists only as prose in a PR comment is a
followup nobody will ever do.

```bash
bd create --type=task --priority=2 --title="Followup from review of {{pr_url}}: <description>" --description="Non-blocking finding from the review of {{pr_url}} (tracking {{issue}}). <file:line> — what it is and why it matters."
```

Collect every id. Before you move on, re-check each finding against the four
triggers above: if one of them fired, it is not a followup and your verdict is
REQUEST_CHANGES.

## 3. If REQUEST_CHANGES

Name **which of the four triggers fired** — say the number — and be specific
about what must change. The contributor should be able to act on your feedback
without asking you a question first.

## 4. If NEEDS_DISCUSSION

This is for "I cannot tell whether this is correct", not for "I would have done
it differently". The latter is an APPROVE with a followup.

```bash
gt mail send {{rig}}/witness -s "PR review needs discussion" -m "PR: {{pr_url}}
Issue: {{issue}}
Question: <what needs clarification>"
```

## 5. If BLOCK (security)

```bash
gt mail send {{rig}}/witness -s "SECURITY: PR blocked" -m "PR: {{pr_url}}
Issue: {{issue}}
Concern: <security issue found>"
```

**Exit criteria:** ONE verdict from {APPROVE, REQUEST_CHANGES, NEEDS_DISCUSSION}
(or a security BLOCK), with a rationale — and if it is APPROVE with followups,
every followup bead is FILED and you are holding its id."""

[[steps]]
id = "submit-review"
title = "Post the review content to the PR (and record on the bead)"
needs = ["make-decision"]
description = """
Your review verdict is worthless if a maintainer can't see it. The deliverable of
this step is a **comment ON THE PR** carrying the full substance of your review —
not a one-line approval stamp, and not only a note buried on the tracking bead.

> **The rule:** the review CONTENT must reach the PR. Always. Recording it on the
> bead is a backstop, not a substitute. NEVER silently skip the PR post.

## 1. Assemble the review comment body

### The FIRST LINE is the verdict. It is a contract, not a header.

The mayor decides merge-or-foreman off the top of your comment. Anything that
makes that line ambiguous costs a wasted dispatch. So line 1 — the very first
line of the comment body, before any prose — is exactly this shape:

```
🤖 Gastown review — <VERDICT> (tracking {{issue}}) — followups: <ids, comma-separated, or `none`>
```

- `<VERDICT>` is one of `APPROVE`, `REQUEST_CHANGES`, `NEEDS_DISCUSSION`. Nothing
  else. **Never `APPROVE WITH CHANGES`** — see the make-decision step; if that is
  what you mean, the verdict is `APPROVE` and the ids go in `followups:`.
- `followups:` names the bead ids you filed in make-decision, or the literal
  `none`. Prose ("a few nits", "minor suggestions below") is NOT an id and does
  not count — an unfiled followup is a followup nobody does.
- On `REQUEST_CHANGES`, `followups:` is normally `none`: the things that must
  change are in the PR, not in a bead.

Worked examples:

```
🤖 Gastown review — APPROVE (tracking {{issue}}) — followups: none
🤖 Gastown review — APPROVE (tracking {{issue}}) — followups: sbx-gastown-a1b2c, sbx-gastown-d3e4f
🤖 Gastown review — REQUEST_CHANGES (tracking {{issue}}) — followups: none
```

### The rest of the body

Compose the full review content as markdown. Below that first line it MUST
include, at minimum:

- **Verdict:** repeated as its own section (the same token as line 1)
- **Rationale:** why you reached that verdict — and on REQUEST_CHANGES, WHICH of
  the four triggers from make-decision fired
- **Per-finding detail:** each issue found, with file:line attribution and whether
  it is blocking, a followup (with its bead id), or a question
- **Operator-decision items:** ANYTHING a maintainer must sign off on before merge
  (tradeoffs, scope calls, risk acceptance). Call these out explicitly under a
  clearly-labeled section — this is the part a human must act on.
- **Test assessment:** CI status + whether coverage is adequate
- **Follow-up beads:** the ids from line 1, each with its title

Write the body to a file to avoid shell-quoting hazards with multi-line content:

```bash
cat > /tmp/gastown-review-{{issue}}.md <<'EOF'
🤖 Gastown review — REQUEST_CHANGES (tracking {{issue}}) — followups: none

## Verdict
REQUEST_CHANGES

## Rationale
Trigger 3 fired: <why the guard cannot fail>.

## Findings
- [BLOCKING] path/to/file.go:42 — <detail>
- [FOLLOWUP sbx-gastown-a1b2c] path/to/other.go:17 — <detail>
- [QUESTION] ...

## Operator decisions required
- <thing the maintainer must sign off on before merge>

## Tests
<CI status + coverage assessment>

## Follow-ups
- <bead-id>: <title>   (or: none)
EOF
```

**Verify line 1 before you post it:**

```bash
head -1 /tmp/gastown-review-{{issue}}.md
```

It must carry one of the three verdict tokens and a `followups:` field. If it
does not, fix the file — do not post and explain in prose.

## 2. Determine identity — post as KbotSB

The review identity is **KbotSB** (`mayor/credentials/kbotsb.token`, measured live
2026-09-25). Resolve BOTH the reviewer and the PR's author before posting:

```bash
KB="${GT_TOWN_ROOT:-$GT_ROOT}/mayor/credentials/kbotsb.token"
ME=$(GH_TOKEN="$(cat "$KB")" gh api user -q .login)      # the reviewer identity: KbotSB
PR_AUTHOR=$(gh pr view {{pr_url}} --json author -q .author.login)
```

**Post the review as KbotSB.** Why: a review posted as KbotSB lands as a FORMAL GitHub
review (APPROVED / CHANGES_REQUESTED). A non-author account can set review state; the
operator's own account cannot on the PRs it authors. Review state is what PR status
tooling reads (`reviewDecision`, branch protection, `gh pr status` / checks) — a
`--comment` verdict is invisible to those tools. Put the credential ON each `gh` call
(`GH_TOKEN="$(cat "$KB")" gh …`): shell state, an `export` included, does not survive
to your next tool call. If `ME` does not come back `KbotSB`, post under ambient auth
and say so in the body.

> ⚠️ A KbotSB review is NOT auto-picked-up by the deacon's foreman dispatch (`"KbotSB"`
> is in `DENY_BOT_LOGINS`, `rigs/deacon/foreman.py`). The mayor dispatches foreman
> rounds by hand.

Either way, the content comment gets posted. There is no branch where the PR
receives nothing.

## 3. Post the content comment (ALWAYS)

```bash
KB="${GT_TOWN_ROOT:-$GT_ROOT}/mayor/credentials/kbotsb.token"   # re-set: a new tool call
GH_TOKEN="$(cat "$KB")" gh pr comment {{pr_url}} --body-file /tmp/gastown-review-{{issue}}.md
```

This is the mandatory deliverable, whichever identity posts it.

**Formal review STATE — gated on authorship.** GitHub blocks `--approve` /
`--request-changes` in exactly one case: the reviewing account AUTHORED the PR. So the
gate is `ME` vs `PR_AUTHOR` from step 2:

```bash
# ME != PR_AUTHOR — submit a FORMAL verdict. Do this; do NOT default to --comment:
GH_TOKEN="$(cat "$KB")" gh pr review {{pr_url}} --approve         --body-file /tmp/gastown-review-{{issue}}.md   # APPROVE
GH_TOKEN="$(cat "$KB")" gh pr review {{pr_url}} --request-changes --body-file /tmp/gastown-review-{{issue}}.md   # REQUEST_CHANGES
GH_TOKEN="$(cat "$KB")" gh pr review {{pr_url}} --comment         --body-file /tmp/gastown-review-{{issue}}.md   # NEEDS_DISCUSSION
```

Most PRs are authored by someone else, so an APPROVE should be an explicit
`--approve` — not a comment. Downgrading a genuine approval to a `--comment` leaves
the PR with no approving review state for the tooling that reads it.

> ⚠️ **`ME == PR_AUTHOR` — self-authored fallback.** GitHub rejects self-approval, so
> do NOT run `--approve` / `--request-changes`. The `gh pr comment` post from step 3 is
> your complete deliverable; optionally add `gh pr review --comment` carrying the same
> body. This happens when KbotSB is unavailable and the review runs under the
> operator's ambient identity on an operator-authored PR — and it is the one case
> where the PR gets no formal state.

## 4. Record the verdict on the tracking bead (backstop — ALWAYS)

Independently of the PR post, always record the verdict on {{issue}} so it survives
even if the PR post fails:

```bash
bd update {{issue}} --notes "Review posted to PR {{pr_url}}. Verdict: <APPROVE|REQUEST_CHANGES|NEEDS_DISCUSSION>. Followups: <bead ids, or none>. Identity: <ME login>."
```

**Exit criteria:** The full review CONTENT is a comment on the PR (verified with
`gh pr view {{pr_url}} --comments`), its FIRST LINE carries the verdict token and
a `followups:` field, and the same verdict is recorded on {{issue}}."""

[[steps]]
id = "file-followups"
title = "File beads for any followup work not already filed"
needs = ["submit-review"]
description = """
Capture any followup work that is still uncaptured.

> ⚠️ **Do NOT re-file what you already filed.** The followups that back an
> APPROVE verdict were filed in **make-decision** — they had to exist before the
> verdict line could name their ids. Those are done. This step exists for what
> you noticed but did not put in the verdict line: out-of-scope discoveries and
> unrequested improvements. If you filed everything in make-decision, this step
> is just the record-keeping in part 3.

**1. For issues found that are outside PR scope:**
```bash
bd create --type=bug --title="Found during PR review: <description>" \
  --description="Discovered while reviewing {{pr_url}}.

  <details of the issue>"
```

**2. For improvements suggested but not required:**
```bash
bd create --type=task --title="Improvement: <description>" \
  --description="Suggested during review of {{pr_url}}.

  <details of the improvement>"
```

**3. Update the tracking issue:**
```bash
bd update {{issue}} --notes "Review complete. Verdict: <APPROVE|REQUEST_CHANGES|NEEDS_DISCUSSION>
Followups filed: <every bead ID, from make-decision AND this step — or none>"
```

**4. Sync beads:**
```bash
bd sync
```

**Exit criteria:** All followup work captured as beads."""

[[steps]]
id = "complete-and-exit"
title = "Verify YOUR deliverables, then exit"
needs = ["file-followups"]
description = """
This step is about YOU, not the PR. The PR's state is already settled — you
posted the verdict in the previous step. What remains are the deliverables
only you can produce.

## Your deliverable was never the PR (sbx-gastown-vf98i)

The verdict comment is the most VISIBLE thing you produce, so it is tempting
to treat posting it as the definition of done. **It is an OUTPUT of your bead,
not the completion of it.** Your bead's deliverables are: the verdict posted,
AND your findings persisted, AND `gt exit` actually run — which releases your
hook and lets the reaper reclaim your slot.

That last one is invisible in PR-space, which is exactly why it gets dropped.
On 2026-08-11 a dozen review and foreman polecats posted their verdicts
perfectly and then sat at an empty prompt forever, each holding a worktree and
a tmux session. The mayor hand-reaped every one. The failures clustered on
THIS role and the foreman role — build polecats exited cleanly — because a
reviewer's mental model of "done" is PR-shaped.

## This step is INCOMPLETE until every check below passes

You cannot satisfy this step by describing it. Run the commands and READ the
output. Several polecats NARRATED an exit they never performed — one pane read
"submitted via `gt done --status DEFERRED`" while its bead sat HOOKED. **A
self-report is not evidence. Actual state is.**

**1. Findings persisted.** Your review reasoning lives nowhere else. The
verdict comment says WHAT you decided; the bead is where WHY survives for the
next scout.
```bash
bd show {{issue}} --notes
```
READ the output. If your findings are not in there, persist them now:
```bash
bd update {{issue}} --notes "Review complete. Verdict: <APPROVE|REQUEST_CHANGES|NEEDS_DISCUSSION>. Followups: <bead ids, or none>. <what you found and why it mattered>"
```

**2. Nothing unpushed.** `gt exit` pushes, but check first — the reaper deletes
your worktree, and a commit that never left it is gone.
```bash
git status                       # must be clean
git log @{u}..HEAD --oneline     # must print NOTHING
```

**3. Exit.** This is a DELIVERABLE, not an epilogue.
```bash
bd sync
gt exit
```

**NOT `gt done`.** See the contract at the top: `gt done` submits to a merge
queue and transitions you to IDLE with the session preserved — it does NOT
release your slot. `gt exit` pushes, persists a completion note, and exits so
the reaper can reclaim you.

**Do NOT close your own bead.** The archivist closes it after extracting
domain knowledge from your findings. An open bead is not an unfinished job.

## What happens next (not your concern)

- The daemon reaper reclaims your worktree and session
- The archivist extracts your findings, then closes the bead
- The mayor acts on your review (merge, or dispatch a foreman)

You are NOT involved in any of that. You're gone. Done means gone.

**Exit criteria:** findings verified present in `bd show {{issue}} --notes`,
`git log @{u}..HEAD` empty, `gt exit` run.

When this step is complete, output the marker. (`STEP_COMPLETE` feeds the Go daemon's
opt-in orchestrator patrol, `internal/daemon/orchestrator_patrol.go`, and is inert where that
patrol is off — as in a town that runs no Go daemon. Emit it anyway: it costs one line and is
the canary that proves `gt prime --hook` delivered the step body.)
```
STEP_COMPLETE complete-and-exit
```"""

[vars]
[vars.pr_url]
description = "The PR URL to review"
required = true

[vars.issue]
description = "The tracking issue for this review task"
required = true

[vars.rig]
description = "The rig this PR review is for"
required = true
