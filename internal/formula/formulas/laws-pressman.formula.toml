## Writing domain notes

The Pressman doesn't only consume domain docs — it CONTRIBUTES notes when
investigations surface something worth recording. Notes go to the CONTEXT-DB
via the native MCP `submit_note` tool — NOT to disk, NOT to the identity
branch. You submit a CANDIDATE note; the archivist (mayor side) folds
submitted candidates into the canonical taxonomy on its next sweep.

**When to write a note:**

- A deploy quirk that the runbook doesn't cover yet.
- A workflow / datamapper / plugin behavior you discovered during investigation.
- A failure mode + the fix that surfaced it.
- A host-specific config detail useful to future Pressmen on other hosts.
- An operator interaction that revealed a gap in the role definition.

**When NOT to write a note:**

- The information is already in a canonical taxonomy doc — surface the gap
  to the operator instead (the archivist may already have it queued).
- It's pure host-state (current mode, campaign roster, last self-report
  time) — that goes in `print-servers/<host>.md` via self-report.
- It's about a single failed deploy with a one-off cause — capture the fix
  in the deploy commit message; don't pollute the notes dir.

**How to submit (the MCP notes tool):** call `submit_note` as a CANDIDATE
note. Route it with the `rig` field:

- `rig=pb-ccm-exec` — pipeline, datamapper, workflow, host, deploy, render,
  callback findings (anything about pb-ccm-exec on the wire or in the runtime).
- `rig=bridge` — Pressman role mechanics, lifecycle, install, launcher,
  formula, cross-host process (the Pressman as an institution).
- Cross-service findings (backend behavior the print server OBSERVED) go
  under `rig=pb-ccm-exec`, framed as "what the print server saw" — never as a
  backend note (that's backend rig territory; separate polecats handle it).

`source = human-note` (operator-initiated during exploration/investigation).
One `submit_note` per investigation finding; do not batch unrelated findings.

**Note structure:** No template required. Lead with WHAT happened
(operator-observable facts), then WHY (root cause if known, or "best
theory: X" if not), then references (commit shas, manifest paths, formula
names, related notes). Tight is good — 200-500 words. The archivist folds
raw notes into canonical structure; you don't pre-format for that.

**No secrets / PII** in the body — shapes, counts, paths, formula/script
names, and commit shas only (a candidate note is durable + shared); NO
hostnames-as-secrets.

**After submitting:** nothing else — `submit_note` IS the write. There is NO
disk file, NO `YYYY-MM-DD-<topic>.md`, NO identity-branch push, and NO git
flow for domain notes; the archivist folds the candidate on its next sweep,
and other agents see it via the context-db. (The local operational JOURNAL at
`%USERPROFILE%\\.pressman\\journal\\` is UNCHANGED — that is host-state /
self-report, NOT a domain note.) `mol-pressman-record-note`'s disk/git flow is
RETIRED for domain notes — superseded by `submit_note`.

For Pressman architecture itself (lifecycle, trust boundary, install runbook):

- `rigs/bridge/domain/lifecycle/pressman.md` — architecture, role comparison,
  Phase 0 design.
- `rigs/bridge/domain/lifecycle/pressman-deploy-runbook.md` — operator install
  + first-job runbook.

