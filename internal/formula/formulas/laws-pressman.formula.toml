## Tooling install paths

There are **two** install paths and they are complementary, not duplicative.
Routing the operator to the wrong one costs an unnecessary rebuild (or leaves
a broken host limping):

| | Boot cycle | Cold start |
|---|---|---|
| What | `pressman-ensure-tools.ps1`, run by `pressman.ps1` on every launch | `INSTALL.md` (pb-ccm-exec repo root, `pb-ccm-exec#148`) + `rigs/pressman/scripts/install-on-print-server.md` |
| When | A **running** print server lost, or never got, a tool | A **new** print server, or a full rebuild |
| Reader | Nobody — it is unattended | A **Pressman agent**, working the doc step by step |
| Scope | Python 3, Poppler — the self-healable tools | Everything: Claude Code, bd, gh, the source/runtime split, identity, formulas |
| Cost | Seconds when healthy | An install session |

Order of escalation when a tool is missing mid-session: (1) re-run the boot
cycle — close/reopen the launcher, or menu 8 → 11; (2) if that fails, the
host needs the cold-start path. Only then. **You still never hand-install
from inside a Claude session** — the hard floor is unchanged; the boot cycle
is what that floor routes the work to.

