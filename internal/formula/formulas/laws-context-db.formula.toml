formula = "laws-context-db"
description = "Operating doctrine: how every dispatched role uses the context-db knowledge service — context-db-FIRST orientation (before scoping any BUILD/DISPATCH/SPEC, not just before reading source), orientation-only retrieval via the correct per-role door, gap-surfacing on a miss, persisting the orient-first reflex to your own memory, and emitting findings + usage/orientation self-feedback as durable notes the archivist folds into canonical knowledge. SPLIT under sbx-gastown-2ey6o: this file carries the inline SAFETY CORE (#0, #1, #2, #5); laws #3, #4, #6, #7, #8 and the foreman carve-out are the context-db-resolved TAIL at concept bridge.laws.context-db."
version = 6
type = "constraint"
phase = "active"

# ⚠️ THIS FILE IS THE BOOTSTRAP LAW AND IT IS SPLIT. [rule].summary is capped by
# Claude Code's hard, non-configurable 10,000-char additionalContext limit; over-cap
# content is SPILLED to a file with only a ~2 KB preview reaching the session, so a
# tail that exceeds it does not truncate, it DISAPPEARS. Keep this core SMALL — it is
# the law that teaches the door every other law tail is fetched through.
# Budget enforced by scripts/check-laws-cap.sh. Add new law text to the TAIL
# (rigs/bridge/domain/laws/context-db.md -> concept bridge.laws.context-db), not here.

[rule]
scope = "all-roles"
severity = "escalation"
summary = """
CONTEXT-DB DOCTRINE — SAFETY CORE

⚠️ THIS IS A SPLIT LAW. What follows is the CORE: the doctrine plus #0, #1, #2 and #5. Laws #3,
#4, #6, #7, #8 and the foreman carve-out are the LAW TAIL — NOT INLINE (last block, below).
This law is the BOOTSTRAP: it teaches you the door every other role's law tail is fetched
through, so it is kept small on purpose and does not grow.

Gastown runs a context-db — a GraphRAG knowledge service over the ~20 rig domain libraries
(source of truth: context/**/*.json; see context-db/TOUCHPOINTS.md). It is your FIRST LOOKUP for
any Sandboxx domain question. Consulting it first is a PRECONDITION of every role's work, not a
convenience (mirrors mayor #0 and mayor #12). First-lookup does NOT mean source-of-truth: you
orient in the db, then verify the exact fact at the source (#1). A MISS is not a dead end — it is
a KNOWN GAP to record (#6, in the tail), so the corpus shortens the next agent's path.

#0 ORIENT BEFORE YOU SCOPE — not merely before you read source.
The sharp failure mode is not "read source without orienting". It is scoping a BUILD / DISPATCH /
PR-SPEC from momentum ("this is obviously new work"), reaching for a source-grep only to confirm
mechanics, and REBUILDING a capability that already existed and was already documented. Draw the
line crisply: a grep or a source read is VERIFY-AT-SOURCE (#1), NEVER orientation. Source is step
3 — confirm the exact fact you will act on. It is never step 1 — discover WHETHER the thing
exists. TRIP-WIRE: about to write a build, a dispatch, or a spec for a capability you have NOT
queried the corpus for? STOP and query first. Worked example — the t2k2n near-miss (2026-07-29):
an agent scoped from momentum, grepped source to "see how it works", and nearly rebuilt an
existing --gcp / authzproxy feature that was already shipped and already documented.

#1 ORIENTATION ONLY — never the source of truth. Retrieved domain context is a MAP, not gospel.
For any EXACT or CURRENT fact — live infrastructure state, compliance/test status, production
data, a specific file:line or function signature, a secret — VERIFY AT THE SOURCE. Never treat a
retrieved chunk as authoritative current state. Each chunk carries its source path + updated_at +
provenance; use them to go verify.

#2 QUERY LIVE — and use the door that matches WHO YOU ARE. The doors are NOT interchangeable.
• DISPATCHED GASTOWN AGENTS (polecat, foreman, prospector, archivist, deacon) and the MAYOR use
  the TOKEN GATE — a minted ID token against the hosted Cloud Run service. This works inside a
  gastown session from ANY cwd: no bridge checkout, no `gcloud run services proxy`, no MCP.
    CTX=https://context-db-2hazwepeiq-uc.a.run.app
    TOKEN=$("${GT_ROOT:-$GT_TOWN_ROOT}"/context-db/scripts/mint-ctx-token.sh --url "$CTX" 2>/dev/null || gcloud auth print-identity-token)
    curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -X POST "$CTX/search" -d '{"query":"...","filters":{"rig":"'"$GT_RIG"'"},"top_k":5}'
    curl -s -H "Authorization: Bearer $TOKEN" "$CTX/concept/<concept_id>"
  Traps, all measured: the mint script defaults to --impersonate (the ctx-db-invoker SA), and the
  bare fallback must NOT pass --audiences, because a USER ADC cannot mint an audience-scoped ID
  token. filters.rig is NESTED — a top-level "rig" is silently dropped. Use top_k, NOT limit.
  /search and /notes are POST (so GET /search = 405); a concept fetch is GET /concept/{id} (so
  POST /concept = 404). Do NOT use `ctx query` — `ctx` is not on PATH in a dispatched session.
  🛑 PROBE THE PATH YOU DEPEND ON — POST /search, never GET /agents. /agents has returned 503
  while the read paths served correctly (sbx-gastown-yd4as), and /healthz is 404 by design.
  Gating orientation on /agents tells you the corpus is down while it is in fact serving.
• THE PRESSMAN uses the HOSTED MCP — https://mcp-context-db.sandboxx.us/mcp — NOT the token gate.
  The pressman runs on WINDOWS print servers via pressman.ps1, where the local stdio launcher in
  .mcp.json (a POSIX `sh -c`, bridge-only) cannot run at all. See laws-pressman #2.
• HUMANS and their own Claude/Cursor agents PREFER the context-db MCP: register the one
  `mcpServers` entry shipped in context-db/plugin (context-db/USING.md §6). It is HEADERS-FIRST:
  search_corpus returns an INDEX per hit (summary + `##` section outline, NOT the body) — read it
  to pick a concept, then get_concept(concept_id[, section]) opens that body on demand. Also
  submit_note to contribute and get_doctrine for the live contract; align to get_doctrine, not to
  any doc's copy of it. STALENESS CHECK (lived 2026-07-20): if search_corpus returns full bodies
  or get_concept is absent, your MCP subprocess predates the #125 headers-first build — reconnect
  before relying on it.
RIG-FILTER every query, whichever door you use. Filtered retrieval is far sharper than unfiltered.

#5 NO SECRETS / PII IN THE DB — and this one is IRREVERSIBLE, so it binds you even if you never
reach the corpus at all. The context-db holds domain knowledge ONLY. Never put credentials,
tokens, keys, or member PII into a note or a concept; those live at the source, never in
retrieval. A secret written into a note cannot be unwritten — the note is drained, folded,
embedded, and snapshotted into an immutable versioned object.

LAW TAIL — NOT INLINE. Laws #3 (the live source wins over the chunk), #4 (emit what you learn as
notes; never edit canonical JSON under context/), #6 (a miss is a KNOWN GAP — record it), #7
(persist the orient-first reflex to your own memory), #8 (self-feedback when orientation ITSELF
misfires), the FOREMAN CARVE-OUT (the foreman inherits orientation and does not orient for
itself — laws-foreman #9), and the flywheel.
⚠️ AND THIS IS ITSELF A WORKED EXAMPLE OF #2 (headers-first): /concept/bridge.laws.context-db is a
POINTER HUB, because the corpus splits a tail into aspect concepts. One get_concept on a hub gives
you headings and the belief you are briefed. Disk is the ONE-SHOT COMPLETE read ($GT_ROOT is set
in every polecat env); the corpus door costs N+1 calls:
    cat "${GT_ROOT:-$GT_TOWN_ROOT}"/rigs/bridge/domain/laws/context-db.md         # complete, 1 read
    curl -s -H "Authorization: Bearer $TOKEN" "$CTX/map/bridge.laws.context-db"   # -> /concept/<aspect>
🛑 IF YOU CAN REACH NEITHER, YOU ARE OPERATING ON INCOMPLETE LAWS. (a) Know it. (b) SAY SO — in
your first response and on your bead. (c) Stay safe: the core above is enough to keep you SAFE
but NOT enough to make you COMPLETE, so never infer that an absent law permits something. When in
doubt, escalate instead of acting.
"""
